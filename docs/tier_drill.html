<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Chain Tier Drill-Down — UC4</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0d14; color: #e2e8f0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

#header { background: #111420; border-bottom: 1px solid #1e2235; padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
#header h1 { font-size: 14px; font-weight: 700; color: #818cf8; }
#header .sub { font-size: 11px; color: #4a5568; }

#toolbar { background: #0d1019; border-bottom: 1px solid #1a1d2e; padding: 7px 16px;
  display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
.prod-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid #1e2235;
  background: #141620; color: #64748b; font-size: 11px; cursor: pointer; transition: all 0.15s; }
.prod-btn:hover { color: #94a3b8; }
.prod-btn.active { background: #1e2a4a; color: #a5b4fc; border-color: #3d4d80; }
.tb-sep { width: 1px; height: 20px; background: #1e2235; }
.layout-btn { padding: 3px 9px; border-radius: 4px; border: 1px solid #1e2235;
  background: #141620; color: #64748b; font-size: 11px; cursor: pointer; }
.layout-btn.active { background: #1a1d2e; color: #818cf8; border-color: #2d3252; }

#main { flex: 1; overflow: hidden; display: flex; }
#tree-wrap { flex: 1; overflow: hidden; position: relative; }
svg#tree-svg { width: 100%; height: 100%; }

/* node styles */
.node circle { stroke-width: 2; cursor: pointer; }
.node text { font-size: 11px; fill: #94a3b8; cursor: pointer; user-select: none; }
.node text.tier-label { font-size: 9px; fill: #4a5568; }
.link { fill: none; stroke: #1e2235; stroke-width: 1.5; }
.link.high   { stroke: rgba(239,68,68,0.4); }
.link.medium { stroke: rgba(249,115,22,0.3); }
.link.inferred { stroke-dasharray: 4,3; stroke: rgba(129,140,248,0.3); }
.node.collapsed circle { stroke-dasharray: 4,2; }

/* risk colors */
.rc-low      { fill: #1e3a2e; stroke: #34d399; }
.rc-medium   { fill: #3b2a12; stroke: #fbbf24; }
.rc-high     { fill: #3b1414; stroke: #f97316; }
.rc-critical { fill: #2a0a0a; stroke: #ef4444; }
.rc-product  { fill: #1a1d3e; stroke: #818cf8; }
.rc-raw      { fill: #1a2a1e; stroke: #34d399; stroke-dasharray:3,2; }

/* sidebar */
#sidebar { width: 280px; border-left: 1px solid #1e2235; overflow-y: auto; flex-shrink: 0; padding: 14px; }
#sidebar h3 { font-size: 12px; color: #818cf8; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid #1a1d2e; }
.sb-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #0f1117; font-size: 11px; }
.sb-label { color: #4a5568; }
.sb-val { color: #e2e8f0; font-weight: 600; max-width: 150px; text-align: right; overflow: hidden; text-overflow: ellipsis; }
.flag-chip { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; margin: 1px; }
.flag-chip.GEO   { color: #f97316; background: rgba(249,115,22,0.12); border: 1px solid rgba(249,115,22,0.25); }
.flag-chip.SANC  { color: #ef4444; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); }
.flag-chip.UFLPA { color: #fbbf24; background: rgba(251,191,36,0.10); border: 1px solid rgba(251,191,36,0.25); }
.flag-chip.ESG   { color: #34d399; background: rgba(52,211,153,0.10); border: 1px solid rgba(52,211,153,0.25); }
.flag-chip.SS    { color: #a855f7; background: rgba(168,85,247,0.10); border: 1px solid rgba(168,85,247,0.25); }
.flag-chip.CBAM  { color: #60a5fa; background: rgba(96,165,250,0.10); border: 1px solid rgba(96,165,250,0.25); }
.risk-badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; }
.rlow  { background: rgba(52,211,153,0.1); color: #34d399; }
.rmed  { background: rgba(251,191,36,0.1); color: #fbbf24; }
.rhigh { background: rgba(249,115,22,0.1); color: #f97316; }
.rcrit { background: rgba(239,68,68,0.12); color: #ef4444; }
#path-breadcrumb { font-size: 10px; color: #4a5568; margin-bottom: 12px; word-break: break-all; line-height: 1.5; }

/* legend */
#legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid #1a1d2e; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #4a5568; }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; }

/* tooltip */
#tooltip { position: fixed; background: #1a1d2e; border: 1px solid #2d3252; border-radius: 6px;
  padding: 8px 12px; font-size: 11px; pointer-events: none; z-index: 100;
  opacity: 0; transition: opacity 0.1s; max-width: 220px; line-height: 1.6; }

/* status badge */
.neo4j-badge { margin-left: auto; font-size: 10px; padding: 2px 8px; border-radius: 20px; border: 1px solid; display: flex; align-items: center; gap: 4px; }
.neo4j-badge.ok  { color: #34d399; border-color: rgba(52,211,153,0.3); }
.neo4j-badge.off { color: #4a5568; border-color: #1e2235; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>Supply Chain Tier Drill-Down</h1>
    <div class="sub">Click nodes to expand/collapse tiers — D3 radial tree</div>
  </div>
  <div class="neo4j-badge off" id="neo4j-badge"><span class="dot"></span>Neo4j</div>
</div>

<div id="toolbar">
  <span style="font-size:10px;color:#4a5568;text-transform:uppercase;letter-spacing:0.06em">Product:</span>
  <button class="prod-btn active" onclick="loadProduct('SCANIA-R-500',this)">Scania R-500</button>
  <button class="prod-btn" onclick="loadProduct('SCANIA-L-340-BEV',this)">L-340 BEV</button>
  <button class="prod-btn" onclick="loadProduct('SCANIA-G-410',this)">G-410</button>
  <button class="prod-btn" onclick="loadProduct('SCANIA-ENG-DC09',this)">DC09 Engine</button>
  <button class="prod-btn" onclick="loadProduct('BTN-001',this)">Button 12mm</button>
  <div class="tb-sep"></div>
  <span style="font-size:10px;color:#4a5568;text-transform:uppercase;letter-spacing:0.06em">Layout:</span>
  <button class="layout-btn active" id="btn-radial"  onclick="setLayout('radial',this)">Radial</button>
  <button class="layout-btn"        id="btn-tree"    onclick="setLayout('tree',this)">Tree</button>
  <button class="layout-btn"        id="btn-collapse" onclick="collapseAll()">Collapse All</button>
  <button class="layout-btn"        onclick="expandAll()">Expand All</button>
</div>

<div id="main">
  <div id="tree-wrap">
    <svg id="tree-svg"><g id="root-g"></g></svg>
  </div>
  <div id="sidebar">
    <h3>Node Detail</h3>
    <div id="path-breadcrumb">—</div>
    <div id="sb-content"><div style="color:#2d3252;font-size:12px;text-align:center;padding:20px 0">Click a node</div></div>
    <div id="legend">
      <div class="leg"><div class="leg-dot" style="background:#818cf8;border:2px solid #818cf8"></div>Product</div>
      <div class="leg"><div class="leg-dot" style="background:#1e3a2e;border:2px solid #34d399"></div>Low</div>
      <div class="leg"><div class="leg-dot" style="background:#3b2a12;border:2px solid #fbbf24"></div>Medium</div>
      <div class="leg"><div class="leg-dot" style="background:#3b1414;border:2px solid #f97316"></div>High</div>
      <div class="leg"><div class="leg-dot" style="background:#2a0a0a;border:2px solid #ef4444"></div>Critical</div>
      <div class="leg"><div class="leg-dot" style="background:#1a2a1e;border:2px solid #34d399;border-style:dashed"></div>Raw Material</div>
    </div>
  </div>
</div>
<div id="tooltip"></div>

<script>

      { name:'Umicore Battery Materials', type:'supplier', tier:2, country:'BE', risk:'LOW', flags:['CBAM'], children:[

   { name:'Bosch', type:'supplier', tier:1, country:'DE', risk:'LOW', flags:[],
     contract_value:'€71M', children:[
      { name:'Infineon Technologies', type:'supplier', tier:2, country:'DE', risk:'MEDIUM', flags:['GEO'], children:[] }
     ]},
   { name:'Knorr-Bremse', type:'supplier', tier:1, country:'DE', risk:'LOW', flags:[],

      { name:'Haldex', type:'supplier', tier:2, country:'SE', risk:'LOW', flags:[], children:[] }

  ]},

        ]},

};
// Copy R-500 structure for G-410 and DC09 with small overrides
DEMO['SCANIA-G-410'] = JSON.parse(JSON.stringify(DEMO['SCANIA-R-500']));
DEMO['SCANIA-G-410'].name = 'Scania G-410 (Construction)';
DEMO['SCANIA-G-410'].sku = 'SCANIA-G-410';
DEMO['SCANIA-ENG-DC09'] = {
  name:'Scania DC09 Euro7 Engine', type:'product', sku:'SCANIA-ENG-DC09', country:'SE',
  children:[
   { name:'Bosch', type:'supplier', tier:1, country:'DE', risk:'LOW', flags:[], contract_value:'€71M',
     children:[
      { name:'Infineon Technologies', type:'supplier', tier:2, country:'DE', risk:'MEDIUM', flags:['GEO'], children:[] },
      { name:'Sensata Technologies', type:'supplier', tier:2, country:'NL', risk:'LOW', flags:[], children:[] }
     ]},
   { name:'Garrett Motion', type:'supplier', tier:1, country:'CH', risk:'MEDIUM', flags:[], contract_value:'€18M', children:[] },
   { name:'Parker Hannifin', type:'supplier', tier:1, country:'US', risk:'LOW', flags:[], contract_value:'€12M',
     children:[{ name:'Honeywell PM', type:'supplier', tier:2, country:'US', risk:'LOW', flags:[], children:[] }]},
   { name:'BorgWarner', type:'supplier', tier:1, country:'US', risk:'LOW', flags:[], contract_value:'€9M',
     children:[{ name:'Tenneco', type:'supplier', tier:2, country:'US', risk:'LOW', flags:[], children:[] }]}
  ]};

/* ── state ── */
let currentLayout = 'radial';
let rootData = null;
let selectedSku = 'SCANIA-R-500';
const TRANSITION = 500;

/* ── D3 tree setup ── */
const svg = d3.select('#tree-svg');
const g   = d3.select('#root-g');
let W, H;

// zoom
svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', e => g.attr('transform', e.transform)));

function resize() {
  const el = document.getElementById('tree-wrap');
  W = el.clientWidth; H = el.clientHeight;
}
window.addEventListener('resize', () => { resize(); render(rootData); });

/* ── risk colors ── */
function riskFill(d) {
  if (d.data.type === 'product') return '#1a1d3e';
  if (d.data.type === 'raw')     return '#1a2a1e';
  const m = {LOW:'#1e3a2e', MEDIUM:'#3b2a12', HIGH:'#3b1414', CRITICAL:'#2a0a0a'};
  return m[d.data.risk] || '#141620';
}
function riskStroke(d) {
  if (d.data.type === 'product') return '#818cf8';
  if (d.data.type === 'raw')     return '#34d399';
  const m = {LOW:'#34d399', MEDIUM:'#fbbf24', HIGH:'#f97316', CRITICAL:'#ef4444'};
  return m[d.data.risk] || '#4a5568';
}
function riskLinkClass(d) {
  if (d.data.inferred) return 'inferred';
  const r = d.data.risk;
  if (r === 'HIGH' || r === 'CRITICAL') return 'high';
  if (r === 'MEDIUM') return 'medium';
  return '';
}
function nodeR(d) {
  if (d.data.type === 'product') return 18;
  if (d.data.type === 'raw') return 10;
  const m = {1:14, 2:11, 3:9, 4:8};
  return m[d.data.tier] || 9;
}

/* ── tree logic ── */
function prepRoot(data) {
  // Assign _children (collapsed state) — start fully expanded
  function init(node) {
    if (node.children && node.children.length) {
      node.children.forEach(init);
    }
  }
  init(data);
  return d3.hierarchy(data, d => d.children);
}

function render(root) {
  if (!root) return;
  resize();

  const tree = currentLayout === 'radial'
    ? d3.tree().size([2 * Math.PI, Math.min(W, H) / 2 - 80])
               .separation((a, b) => (a.parent === b.parent ? 1 : 2) / a.depth)
    : d3.tree().size([H - 40, W - 340]).nodeSize([26, 180]);

  tree(root);

  // Center transform
  const tx = currentLayout === 'radial' ? `translate(${W/2},${H/2})` : `translate(60,20)`;

  // Links
  const linkFn = currentLayout === 'radial'
    ? d3.linkRadial().angle(d => d.x).radius(d => d.y)
    : d3.linkHorizontal().x(d => d.y).y(d => d.x);

  const links = g.selectAll('.link').data(root.links(), d => d.target.data.name);
  links.enter().append('path').attr('class', d => `link ${riskLinkClass(d.target)}`)
    .attr('d', linkFn).attr('opacity', 0)
    .transition().duration(TRANSITION).attr('opacity', 1);
  links.transition().duration(TRANSITION).attr('d', linkFn)
    .attr('class', d => `link ${riskLinkClass(d.target)}`);
  links.exit().transition().duration(TRANSITION).attr('opacity', 0).remove();

  // Nodes
  const nodes = root.descendants();
  const nodeG = g.selectAll('.node').data(nodes, d => d.data.name + (d.data.tier || 0));

  const enter = nodeG.enter().append('g').attr('class', 'node')
    .attr('transform', d => nodeTransform(d))
    .attr('opacity', 0)
    .on('click', (e, d) => toggleNode(d))
    .on('mouseenter', (e, d) => showTip(e, d))
    .on('mouseleave', hideTip);

  enter.append('circle')
    .attr('r', nodeR)
    .attr('fill', riskFill)
    .attr('stroke', riskStroke);
  enter.append('text')
    .attr('dy', '0.31em')
    .attr('text-anchor', d => currentLayout === 'radial' ? (d.x < Math.PI ? 'start' : 'end') : 'start')
    .attr('x', d => (currentLayout === 'radial' ? (d.x < Math.PI ? 1 : -1) : 1) * (nodeR(d) + 5))
    .text(d => d.data.name.length > 22 ? d.data.name.slice(0, 20) + '…' : d.data.name);
  enter.append('text').attr('class', 'tier-label')
    .attr('dy', d => nodeR(d) + 11).attr('text-anchor', 'middle')
    .text(d => d.data.type === 'supplier' ? `T${d.data.tier} · ${d.data.country}` :
               d.data.type === 'raw' ? `Raw · ${d.data.country}` : `${d.data.country}`);

  enter.transition().duration(TRANSITION).attr('opacity', 1)
    .attr('transform', d => nodeTransform(d));

  nodeG.transition().duration(TRANSITION)
    .attr('transform', d => nodeTransform(d))
    .attr('opacity', 1);
  nodeG.select('circle').transition().duration(TRANSITION)
    .attr('fill', riskFill).attr('stroke', riskStroke).attr('r', nodeR);
  nodeG.select('text:not(.tier-label)')
    .attr('text-anchor', d => currentLayout === 'radial' ? (d.x < Math.PI ? 'start' : 'end') : 'start')
    .attr('x', d => (currentLayout === 'radial' ? (d.x < Math.PI ? 1 : -1) : 1) * (nodeR(d) + 5));

  nodeG.exit().transition().duration(TRANSITION).attr('opacity', 0).remove();

  g.attr('transform', tx);
}

function nodeTransform(d) {
  if (currentLayout === 'radial') {
    const [x, y] = d3.pointRadial(d.x, d.y);
    return `translate(${x},${y})`;
  }
  return `translate(${d.y},${d.x})`;
}

function toggleNode(d) {
  // collapse/expand
  if (d.children) {
    d._children = d.children;
    d.children = null;
  } else if (d._children) {
    d.children = d._children;
    d._children = null;
  }
  render(rootData);
  showDetail(d);
}

function collapseAll() {
  function c(node) {
    if (node.children) {
      node.children.forEach(c);
      if (node.depth > 0) { node._children = node.children; node.children = null; }
    }
  }
  if (rootData) { c(rootData); render(rootData); }
}

function expandAll() {
  function e(node) {
    if (node._children) { node.children = node._children; node._children = null; }
    if (node.children) node.children.forEach(e);
  }
  if (rootData) { e(rootData); render(rootData); }
}

/* ── product loading ── */
function loadProduct(sku, btn) {
  selectedSku = sku;
  document.querySelectorAll('.prod-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const data = DEMO[sku];
  if (!data) return;
  g.selectAll('*').remove();
  rootData = prepRoot(JSON.parse(JSON.stringify(data)));
  render(rootData);
}

function setLayout(l, btn) {
  currentLayout = l;
  document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  g.selectAll('*').remove();
  if (rootData) render(rootData);
}

/* ── sidebar detail ── */
function showDetail(d) {
  const n = d.data;
  const path = d.ancestors().reverse().map(a => a.data.name).join(' → ');
  document.getElementById('path-breadcrumb').textContent = path;

  const riskClass = {LOW:'rlow', MEDIUM:'rmed', HIGH:'rhigh', CRITICAL:'rcrit'}[n.risk] || 'rlow';
  const flagsHtml = (n.flags || []).map(f => `<span class="flag-chip ${f}">${f}</span>`).join('');

  document.getElementById('sb-content').innerHTML = `
    <div class="sb-row"><span class="sb-label">Name</span><span class="sb-val">${n.name}</span></div>
    <div class="sb-row"><span class="sb-label">Type</span><span class="sb-val" style="text-transform:capitalize">${n.type}</span></div>
    ${n.tier ? `<div class="sb-row"><span class="sb-label">Tier</span><span class="sb-val">T${n.tier}</span></div>` : ''}
    ${n.country ? `<div class="sb-row"><span class="sb-label">Country</span><span class="sb-val">${n.country}</span></div>` : ''}
    ${n.risk ? `<div class="sb-row"><span class="sb-label">Risk</span><span class="sb-val"><span class="risk-badge ${riskClass}">${n.risk}</span></span></div>` : ''}
    ${n.contract_value ? `<div class="sb-row"><span class="sb-label">Contract</span><span class="sb-val">${n.contract_value}/yr</span></div>` : ''}
    ${n.inferred ? `<div class="sb-row"><span class="sb-label">Source</span><span class="sb-val" style="color:#818cf8">LLM inferred</span></div>` : ''}
    ${flagsHtml ? `<div style="margin-top:8px">${flagsHtml}</div>` : ''}
    ${d._children ? `<div style="margin-top:8px;font-size:10px;color:#4a5568">${d._children.length} child node(s) hidden — click to expand</div>` : ''}
    ${d.children ? `<div style="margin-top:8px;font-size:10px;color:#4a5568">${d.children.length} child node(s) shown — click to collapse</div>` : ''}
    ${(n.risk === 'HIGH' || n.risk === 'CRITICAL') ? `<div style="margin-top:10px;padding:8px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:4px;font-size:10px;color:#ef4444">
      <strong>Risk Alert:</strong> ${n.name} rated ${n.risk}. ${(n.flags||[]).includes('SANC') ? 'SANCTIONS — legal review required.' : ''} ${(n.flags||[]).includes('UFLPA') ? 'UFLPA — potential US import ban.' : ''}
    </div>` : ''}
  `;
}

/* ── tooltip ── */
function showTip(e, d) {
  const n = d.data;
  const tip = document.getElementById('tooltip');
  tip.innerHTML = `<strong>${n.name}</strong><br>${n.type === 'supplier' ? `T${n.tier} · ${n.country} · ${n.risk || ''}` : n.type}${n.contract_value ? '<br>Contract: ' + n.contract_value : ''}`;
  tip.style.opacity = '1';
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top  = (e.clientY - 10) + 'px';
}
function hideTip() { document.getElementById('tooltip').style.opacity = '0'; }

/* ── Neo4j integration ── */
const NEO4J = 'http://localhost:17474';
const NEO4J_AUTH = 'bmVvNGo6akdGcmZpTkF1d1c4WVBzWlhJb2ZjTndi';

async function tryNeo4j(sku) {
  try {
    const q = `
      MATCH path = (p:Product {sku: $sku})-[:SUPPLIED_BY|SOURCED_FROM*1..5]->(n)
      WITH p, nodes(path) AS ns, relationships(path) AS rs
      RETURN p.name AS product, p.sku AS sku, p.country AS country,
             [x IN ns | {name: x.name, tier: x.tier, country: x.country,
              risk: coalesce(x.risk_score,'LOW'), flags: coalesce(x.flags,[]),
              type: labels(x)[0], contract_value: x.contract_value}] AS chain
      LIMIT 200
    `;
    const r = await fetch(`${NEO4J}/db/neo4j/tx/commit`, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Basic ${NEO4J_AUTH}`},
      body: JSON.stringify({statements:[{statement:q, parameters:{sku}}]})
    });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (d.errors?.length) throw new Error(d.errors[0].message);
    const badge = document.getElementById('neo4j-badge');
    badge.className = 'neo4j-badge ok';
    badge.innerHTML = '<span class="dot"></span>Neo4j Live';
    console.log('[Neo4j] data fetched for', sku, d.results[0]?.data?.length, 'paths');
  } catch(e) {
    console.log('[Neo4j] offline:', e.message);
  }
}

/* ── init ── */
resize();
loadProduct('SCANIA-R-500', document.querySelector('.prod-btn.active'));
tryNeo4j('SCANIA-R-500');
</script>
