<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supply Chain Diff — SupplyLens</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; font-size: 13px; }
  .header { background: #1a1d2e; border-bottom: 1px solid #2d3748; padding: 14px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .header h1 { font-size: 16px; color: #a78bfa; font-weight: 600; }
  .header .meta { color: #718096; font-size: 12px; }
  .snap-labels { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .snap-from { background: #2d3748; padding: 3px 10px; border-radius: 10px; color: #94a3b8; }
  .snap-to { background: #1a4731; padding: 3px 10px; border-radius: 10px; color: #6ee7b7; }
  .arrow { color: #4a5568; }

  .stats { display: flex; gap: 12px; padding: 14px 20px; background: #141720; border-bottom: 1px solid #2d3748; flex-wrap: wrap; }
  .stat-card { background: #1a1d2e; border-radius: 8px; padding: 10px 18px; border-left: 3px solid; min-width: 100px; text-align: center; }
  .stat-card.critical { border-color: #f56565; }
  .stat-card.high { border-color: #ed8936; }
  .stat-card.medium { border-color: #4299e1; }
  .stat-card.added { border-color: #48bb78; }
  .stat-card.events { border-color: #9f7aea; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .critical .stat-num { color: #f56565; }
  .high .stat-num { color: #ed8936; }
  .medium .stat-num { color: #4299e1; }
  .added .stat-num { color: #48bb78; }
  .events .stat-num { color: #9f7aea; }
  .stat-label { color: #718096; font-size: 11px; margin-top: 2px; }

  .body { display: grid; grid-template-columns: 1fr 340px; height: calc(100vh - 140px); }
  .main-panel { overflow-y: auto; padding: 16px 20px; }
  .side-panel { border-left: 1px solid #2d3748; overflow-y: auto; padding: 16px; background: #141720; }

  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #718096; margin-bottom: 10px; margin-top: 18px; }
  .section-title:first-child { margin-top: 0; }

  .change-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 6px; margin-bottom: 6px; border-left: 3px solid; background: #1a1d2e; }
  .change-item.CRITICAL { border-color: #f56565; }
  .change-item.HIGH { border-color: #ed8936; }
  .change-item.MEDIUM { border-color: #4299e1; }
  .change-item.INFO { border-color: #4a5568; }

  .sev-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .CRITICAL .sev-badge { background: #742a2a; color: #feb2b2; }
  .HIGH .sev-badge { background: #7b341e; color: #fed7aa; }
  .MEDIUM .sev-badge { background: #1a365d; color: #bee3f8; }
  .INFO .sev-badge { background: #2d3748; color: #a0aec0; }

  .change-name { font-weight: 600; color: #e2e8f0; }
  .change-detail { color: #94a3b8; font-size: 12px; margin-top: 2px; }
  .change-detail .flag { display: inline-block; background: #2d3748; color: #e2e8f0; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin: 0 2px; font-family: monospace; }
  .change-detail .flag.new { background: #1a4731; color: #6ee7b7; }
  .change-detail .flag.removed { background: #742a2a; color: #feb2b2; text-decoration: line-through; }
  .z-old { color: #f56565; }
  .z-new { color: #48bb78; }
  .z-arrow { color: #f56565; margin: 0 4px; }

  .node-pill { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #1a1d2e; border-radius: 6px; margin-bottom: 5px; }
  .node-pill.added { border-left: 3px solid #48bb78; }
  .node-pill.removed { border-left: 3px solid #f56565; opacity: 0.7; }
  .tier-badge { font-size: 10px; color: #a0aec0; background: #2d3748; padding: 1px 5px; border-radius: 3px; }
  .country-badge { font-size: 10px; color: #718096; }

  .rel-pill { font-size: 11px; padding: 5px 10px; background: #1a1d2e; border-radius: 4px; margin-bottom: 4px; color: #94a3b8; border-left: 3px solid #48bb78; }
  .rel-pill .src { color: #a78bfa; }
  .rel-pill .type { color: #4a5568; font-size: 10px; }
  .rel-pill .dst { color: #63b3ed; }

  .event-pill { font-size: 11px; padding: 6px 10px; background: #2d1f4e; border-radius: 4px; margin-bottom: 4px; color: #d6bcfa; border-left: 3px solid #9f7aea; font-family: monospace; }

  .filter-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn { padding: 4px 12px; border-radius: 12px; border: 1px solid #2d3748; background: #1a1d2e; color: #94a3b8; cursor: pointer; font-size: 11px; transition: all 0.15s; }
  .filter-btn:hover, .filter-btn.active { border-color: #a78bfa; color: #a78bfa; background: #1a1230; }
  .filter-btn.f-CRITICAL.active { border-color: #f56565; color: #f56565; background: #2d1515; }
  .filter-btn.f-HIGH.active { border-color: #ed8936; color: #ed8936; background: #2d1e10; }
  .filter-btn.f-MEDIUM.active { border-color: #4299e1; color: #4299e1; background: #0f1f33; }

  .empty { color: #4a5568; font-size: 12px; padding: 8px 0; }
</style>
</head>
<body>

<div class="header">
  <h1>Supply Chain Diff</h1>
  <div class="snap-labels">
    <span class="snap-from" id="lbl-from">—</span>
    <span class="arrow">→</span>
    <span class="snap-to" id="lbl-to">—</span>
  </div>
  <div class="meta">Changes detected since baseline snapshot</div>
</div>

<div class="stats">
  <div class="stat-card critical"><div class="stat-num" id="cnt-critical">0</div><div class="stat-label">CRITICAL</div></div>
  <div class="stat-card high"><div class="stat-num" id="cnt-high">0</div><div class="stat-label">HIGH</div></div>
  <div class="stat-card medium"><div class="stat-num" id="cnt-medium">0</div><div class="stat-label">MEDIUM</div></div>
  <div class="stat-card added"><div class="stat-num" id="cnt-nodes">0</div><div class="stat-label">New Suppliers</div></div>
  <div class="stat-card events"><div class="stat-num" id="cnt-events">0</div><div class="stat-label">New Events</div></div>
</div>

<div class="body">
  <div class="main-panel">
    <div class="filter-row">
      <span style="color:#718096;font-size:11px;align-self:center">Filter:</span>
      <button class="filter-btn active" onclick="setFilter('ALL')">All</button>
      <button class="filter-btn f-CRITICAL" onclick="setFilter('CRITICAL')">🔴 Critical</button>
      <button class="filter-btn f-HIGH" onclick="setFilter('HIGH')">🟡 High</button>
      <button class="filter-btn f-MEDIUM" onclick="setFilter('MEDIUM')">🔵 Medium</button>
    </div>
    <div class="section-title">Node-level changes</div>
    <div id="changes-list"></div>
  </div>

  <div class="side-panel">
    <div class="section-title">New suppliers / nodes</div>
    <div id="added-nodes"></div>

    <div class="section-title" style="margin-top:16px">New relationships</div>
    <div id="added-rels"></div>

    <div class="section-title" style="margin-top:16px">New events</div>
    <div id="added-events"></div>

    <div class="section-title" style="margin-top:16px">Removed nodes</div>
    <div id="removed-nodes"></div>
  </div>
</div>

<script>
/* ── embedded demo diff data ─────────────────────────────────────────────── */
const DIFF = {
  from: "2026-07-01 baseline",
  to: "2026-08-14 current",
  summary: { critical: 4, high: 6, medium: 3, added_nodes: 3, added_events: 3 },
  added_nodes: [
    { name: "Mobileye Global", tier: 1, country: "Israel", risk_flags: ["GEOPOLITICAL_RISK"] },
    { name: "JSR Corporation", tier: 3, country: "Japan", risk_flags: ["SINGLE_SOURCE","STRATEGIC_MATERIAL"] },
    { name: "Cryoin Engineering", tier: 3, country: "Ukraine", risk_flags: ["GEOPOLITICAL_RISK","FORCE_MAJEURE"] },
  ],
  removed_nodes: [],
  added_relationships: [
    ["Scania AB", "Mobileye Global", "SUPPLIED_BY"],
    ["TSMC", "JSR Corporation", "SOURCED_FROM"],
    ["TSMC", "Cryoin Engineering", "SOURCED_FROM"],
  ],
  removed_relationships: [],
  added_events: [
    "EVT-NVIDIA-EXPORT-CTRL-2023",
    "EVT-ASML-CHINA-RESTRICTION-2023",
    "EVT-NEON-UKRAINE-SHORTAGE-2022",
  ],
  removed_events: [],
  changes: [
    { name: "Luminar Technologies", change_type: "MODIFIED", field: "risk_flag_added", new_value: "DISTRESS", severity: "CRITICAL" },
    { name: "Cryoin Engineering",   change_type: "ADDED",    field: "risk_flag",       new_value: "FORCE_MAJEURE", severity: "CRITICAL" },
    { name: "Leoni AG",             change_type: "MODIFIED", field: "altman_z",        old_value: 1.4, new_value: 1.1, severity: "CRITICAL" },
    { name: "TSMC",                 change_type: "MODIFIED", field: "risk_flag_added", new_value: "EXPORT_CTRL", severity: "CRITICAL" },
    { name: "ZF Friedrichshafen",   change_type: "MODIFIED", field: "risk_flag_added", new_value: "FINANCIAL_STRESS", severity: "HIGH" },
    { name: "ZF Friedrichshafen",   change_type: "MODIFIED", field: "altman_z",        old_value: 2.8, new_value: 1.95, severity: "HIGH" },
    { name: "SSAB",                 change_type: "MODIFIED", field: "risk_flag_added", new_value: "CBAM_EXPOSURE", severity: "HIGH" },
    { name: "JSR Corporation",      change_type: "ADDED",    field: "risk_flag",       new_value: "SINGLE_SOURCE", severity: "HIGH" },
    { name: "JSR Corporation",      change_type: "ADDED",    field: "risk_flag",       new_value: "STRATEGIC_MATERIAL", severity: "HIGH" },
    { name: "Norilsk Nickel",       change_type: "MODIFIED", field: "altman_z",        old_value: 1.6, new_value: 1.3, severity: "MEDIUM" },
    { name: "Mobileye Global",      change_type: "ADDED",    field: "risk_flag",       new_value: "GEOPOLITICAL_RISK", severity: "HIGH" },
    { name: "Luminar Technologies", change_type: "MODIFIED", field: "altman_z",        old_value: 0.8, new_value: 0.6, severity: "MEDIUM" },
    { name: "Bosch",                change_type: "MODIFIED", field: "altman_z",        old_value: 3.9, new_value: 3.7, severity: "INFO" },
  ]
};

/* ── state ────────────────────────────────────────────────────────────────── */
let activeFilter = "ALL";

/* ── init ─────────────────────────────────────────────────────────────────── */
function init() {
  document.getElementById("lbl-from").textContent = DIFF.from;
  document.getElementById("lbl-to").textContent   = DIFF.to;

  const sev = { CRITICAL: 0, HIGH: 0, MEDIUM: 0 };
  DIFF.changes.forEach(c => { if (sev[c.severity] !== undefined) sev[c.severity]++; });

  document.getElementById("cnt-critical").textContent = sev.CRITICAL;
  document.getElementById("cnt-high").textContent     = sev.HIGH;
  document.getElementById("cnt-medium").textContent   = sev.MEDIUM;
  document.getElementById("cnt-nodes").textContent    = DIFF.added_nodes.length;
  document.getElementById("cnt-events").textContent   = DIFF.added_events.length;

  renderChanges();
  renderSide();
}

/* ── render changes ───────────────────────────────────────────────────────── */
function renderChanges() {
  const el = document.getElementById("changes-list");
  const items = activeFilter === "ALL"
    ? DIFF.changes
    : DIFF.changes.filter(c => c.severity === activeFilter);

  if (!items.length) { el.innerHTML = '<div class="empty">No changes at this severity level.</div>'; return; }

  el.innerHTML = items.map(c => {
    const detail = formatDetail(c);
    return `<div class="change-item ${c.severity}">
      <span class="sev-badge">${c.severity}</span>
      <div>
        <div class="change-name">${c.name}</div>
        <div class="change-detail">${detail}</div>
      </div>
    </div>`;
  }).join("");
}

function formatDetail(c) {
  if (c.field === "risk_flag_added") {
    return `New risk flag: <span class="flag new">${c.new_value}</span>`;
  }
  if (c.field === "risk_flag_removed") {
    return `Removed flag: <span class="flag removed">${c.old_value}</span>`;
  }
  if (c.field === "risk_flag" && c.change_type === "ADDED") {
    return `New node — flag: <span class="flag new">${c.new_value}</span>`;
  }
  if (c.field === "altman_z") {
    const dir = c.new_value < c.old_value ? "↓" : "↑";
    const cl  = c.new_value < 1.81 ? "CRITICAL" : c.new_value < 2.99 ? "HIGH" : "INFO";
    const zone = c.new_value < 1.81 ? "distress zone" : c.new_value < 2.99 ? "grey zone" : "safe zone";
    return `Altman Z: <span class="z-old">${c.old_value.toFixed(2)}</span>
            <span class="z-arrow">${dir}</span>
            <span class="z-new">${c.new_value.toFixed(2)}</span>
            <span style="color:#718096;font-size:11px"> → ${zone}</span>`;
  }
  if (c.field === "tier") {
    return `Tier reclassified: T${c.old_value} → T${c.new_value}`;
  }
  if (c.change_type === "REMOVED") {
    return `Supplier removed from graph`;
  }
  return JSON.stringify({ field: c.field, old: c.old_value, new: c.new_value });
}

/* ── render side ──────────────────────────────────────────────────────────── */
function renderSide() {
  const nodesEl = document.getElementById("added-nodes");
  nodesEl.innerHTML = DIFF.added_nodes.length
    ? DIFF.added_nodes.map(n => `
        <div class="node-pill added">
          <div>
            <span style="font-weight:600">${n.name}</span>
            <span class="tier-badge">T${n.tier}</span>
            <span class="country-badge">${n.country}</span>
            <div style="margin-top:3px">
              ${(n.risk_flags||[]).map(f => `<span class="flag new" style="font-size:10px;margin-right:3px">${f}</span>`).join("")}
            </div>
          </div>
        </div>`).join("")
    : '<div class="empty">None</div>';

  const relsEl = document.getElementById("added-rels");
  relsEl.innerHTML = DIFF.added_relationships.length
    ? DIFF.added_relationships.map(r => `
        <div class="rel-pill">
          <span class="src">${r[0]}</span>
          <span class="type"> —[${r[2]}]→ </span>
          <span class="dst">${r[1]}</span>
        </div>`).join("")
    : '<div class="empty">None</div>';

  const eventsEl = document.getElementById("added-events");
  eventsEl.innerHTML = DIFF.added_events.length
    ? DIFF.added_events.map(e => `<div class="event-pill">${e}</div>`).join("")
    : '<div class="empty">None</div>';

  const removedEl = document.getElementById("removed-nodes");
  removedEl.innerHTML = DIFF.removed_nodes.length
    ? DIFF.removed_nodes.map(n => `<div class="node-pill removed">${n}</div>`).join("")
    : '<div class="empty">None</div>';
}

/* ── filter ───────────────────────────────────────────────────────────────── */
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  const match = f === "ALL"
    ? document.querySelector('.filter-btn:first-of-type')
    : document.querySelector(`.filter-btn.f-${f}`);
  if (match) match.classList.add("active");
  renderChanges();
}

init();
</script>
</body>
</html>
