    notes: "Monitor Bosch Z-score quarterly. Trigger 30-day action if Z drops below 2.5.",
    status: "Monitoring",
  },
  {
    urgency: "MONITOR",
    supplier: "SQM",
    tier: 3, country: "Chile", industry: "Lithium / Potassium Mining",
    revenue_at_risk_m: 95.6,
    risk_reason: "WATER_STRESS in Atacama. Chilean lithium nationalization legislation in progress. No immediate supply risk but regulatory trajectory negative.",
    risk_flags: [{ label: "WATER_STRESS", level: "medium" }],
    actions: ["MONITOR", "EVALUATE"],
    deadline: null,
    alts: [
      { name: "Albemarle (US)", score: 68, action: "EVALUATE" },
      { name: "Ganfeng Lithium (CN)", score: 55, action: "EVALUATE" },
    ],
    timeline: [
      { date: "Q1 2027", text: "Chile lithium nationalization law expected — assess impact", color: "#ecc94b" },
    ],
    notes: "SQM operates in Atacama Desert. Government seeking 30% state ownership. Supply not affected short-term.",
    status: "Monitoring",
  },
  {
    urgency: "MONITOR",
    supplier: "Infineon Technologies",
    tier: 2, country: "Germany", industry: "Power Semiconductors",
    revenue_at_risk_m: 45.1,
    risk_reason: "SINGLE_SOURCE for certain power modules. Financially healthy (Z=3.4). Watch for capacity constraints post-2025 expansion.",
    risk_flags: [{ label: "SINGLE_SOURCE", level: "high" }],
    actions: ["MONITOR"],
    deadline: null,
    alts: [{ name: "STMicroelectronics (CH)", score: 70, action: "EVALUATE" }],
    timeline: [
      { date: "H1 2025", text: "Dresden fab expansion complete — capacity review", color: "#48bb78" },
    ],
    notes: "Infineon expanding Dresden fab (+€5B). Capacity constraint risk reduces post-2025.",
    status: "Monitoring",
  },
];

/* ── state ─────────────────────────────────────────────────────────────────── */
let currentFilter = "IMMEDIATE";
let expandedCards = new Set();

/* ── init ──────────────────────────────────────────────────────────────────── */
function init() {
  const totalRAR = ACTIONS.reduce((s, a) => s + a.revenue_at_risk_m, 0);
  document.getElementById("total-rar").textContent = `€${totalRAR.toFixed(0)}M total exposure`;

  renderSidebar();
  renderActions();
}

/* ── render actions ─────────────────────────────────────────────────────────── */
function renderActions() {
  const el = document.getElementById("action-list");
  const items = currentFilter === "ALL"
    ? ACTIONS
    : ACTIONS.filter(a => {
        if (currentFilter === "IMMEDIATE") return a.urgency === "IMMEDIATE";
        if (currentFilter === "30-DAY")   return a.urgency === "30-DAY";
        if (currentFilter === "90-DAY")   return a.urgency === "90-DAY";
        if (currentFilter === "MONITOR")  return a.urgency === "MONITOR";
        return true;
      });

  // Group by urgency if ALL
  if (currentFilter === "ALL") {
    const groups = { IMMEDIATE: [], "30-DAY": [], "90-DAY": [], MONITOR: [] };
    items.forEach(a => groups[a.urgency].push(a));
    el.innerHTML = Object.entries(groups).map(([urg, acts]) =>
      acts.length ? `
        <div class="urgency-header">
          <span class="urgency-badge ub-${urg}">${urg}</span>
          <span class="urgency-desc">${urgDesc(urg)}</span>
        </div>
        ${acts.map(renderCard).join("")}
      ` : ""
    ).join("");
  } else {
    el.innerHTML = `
      <div class="urgency-header">
        <span class="urgency-badge ub-${currentFilter}">${currentFilter}</span>
        <span class="urgency-desc">${urgDesc(currentFilter)}</span>
      </div>
      ${items.map(renderCard).join("")}
    `;
  }
}

function urgDesc(u) {
  return { IMMEDIATE: "Act within 7 days", "30-DAY": "Initiate within 30 days",
           "90-DAY": "Plan within quarter", MONITOR: "Watch, no action yet" }[u] || "";
}

function renderCard(a) {
  const id = a.supplier.replace(/\s+/g, "-").toLowerCase();
  const open = expandedCards.has(id);
  const urgClass = { IMMEDIATE: "IMMEDIATE", "30-DAY": "d30", "90-DAY": "d90", MONITOR: "MONITOR" }[a.urgency];
  const rarColor = { IMMEDIATE: "#f56565", "30-DAY": "#ed8936", "90-DAY": "#ecc94b", MONITOR: "#48bb78" }[a.urgency];

  return `<div class="action-card ${urgClass}" id="card-${id}">
    <div class="card-header" onclick="toggleCard('${id}')">
      <div>
        <div class="supplier-name">${a.supplier}</div>
        <div class="supplier-meta">T${a.tier} · ${a.country} · ${a.industry}</div>
        <div class="risk-reason" style="margin-top:5px">${a.risk_reason}</div>
        <div class="action-tags" style="margin-top:8px">
          ${a.actions.map(ac => `<span class="action-tag at-${ac}">${ac.replace("_"," ")}</span>`).join("")}
          ${a.risk_flags.map(f => `<span class="risk-chip ${f.level}">${f.label}</span>`).join("")}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
        <div class="rar-badge ${urgClass}"><span class="rar-num">€${a.revenue_at_risk_m.toFixed(0)}M</span></div>
        ${a.deadline ? `<div style="font-size:10px;color:#718096">Due ${a.deadline}</div>` : ""}
        <select class="status-sel" onclick="event.stopPropagation()">
          <option ${a.status==="Pending"?"selected":""}>Pending</option>
          <option ${a.status==="In Review"?"selected":""}>In Review</option>
          <option ${a.status==="Actioned"?"selected":""}>Actioned</option>
          <option ${a.status==="Monitoring"?"selected":""}>Monitoring</option>
        </select>
        <span class="card-expand ${open?"open":""}">▼</span>
      </div>
    </div>
    <div class="card-body ${open?"open":""}" id="body-${id}">
      <div class="card-body-inner">
        ${a.alts.length ? `
          <div class="section-mini">Alternative suppliers</div>
          ${a.alts.map(alt => `
            <div class="alt-row">
              <span class="alt-name">${alt.name}</span>
              <div class="score-bar-wrap">
                <div class="mini-bar"><div class="mini-bar-fill" style="width:${alt.score}%"></div></div>
                <span class="mini-score">${alt.score}</span>
              </div>
              <span class="action-tag at-${alt.action}" style="margin-left:4px">${alt.action.replace("_"," ")}</span>
            </div>`).join("")}
        ` : ""}

        <div class="section-mini" style="margin-top:14px">Action timeline</div>
        ${a.timeline.map(t => `
          <div class="timeline-row">
            <div class="tl-dot" style="background:${t.color}"></div>
            <div class="tl-date">${t.date}</div>
            <div class="tl-text">${t.text}</div>
          </div>`).join("")}

        <div class="section-mini" style="margin-top:14px">Notes</div>
        <div class="notes-area">${a.notes}</div>
      </div>
    </div>
  </div>`;
}

/* ── sidebar ────────────────────────────────────────────────────────────────── */
function renderSidebar() {
  const rarByUrgency = { IMMEDIATE: 0, "30-DAY": 0, "90-DAY": 0, MONITOR: 0 };
  ACTIONS.forEach(a => rarByUrgency[a.urgency] += a.revenue_at_risk_m);
  const maxRAR = Math.max(...Object.values(rarByUrgency));

  const rarColors = { IMMEDIATE: "#f56565", "30-DAY": "#ed8936", "90-DAY": "#ecc94b", MONITOR: "#48bb78" };
  document.getElementById("rar-sidebar").innerHTML = Object.entries(rarByUrgency).map(([u, v]) =>
    `<div class="exposure-row">
      <span class="exposure-label">${u}</span>
      <span class="exposure-val" style="color:${rarColors[u]}">€${v.toFixed(0)}M</span>
    </div>
    <div class="r-bar"><div class="r-bar-fill" style="width:${(v/maxRAR*100).toFixed(0)}%;background:${rarColors[u]}"></div></div>`
  ).join("");

  const riskTypes = {};
  ACTIONS.forEach(a => a.risk_flags.forEach(f => {
    riskTypes[f.label] = (riskTypes[f.label] || 0) + 1;
  }));
  const sortedRT = Object.entries(riskTypes).sort((a,b) => b[1]-a[1]);
  document.getElementById("risk-type-sidebar").innerHTML = sortedRT.map(([label, cnt]) =>
    `<div class="risk-type-row">
      <span style="color:#94a3b8">${label}</span>
      <span class="rt-count">${cnt}</span>
    </div>`
  ).join("");

  const actionTypes = {};
  ACTIONS.forEach(a => a.actions.forEach(ac => {
    actionTypes[ac] = (actionTypes[ac] || 0) + 1;
  }));
  const sortedAT = Object.entries(actionTypes).sort((a,b) => b[1]-a[1]);
  document.getElementById("action-type-sidebar").innerHTML = sortedAT.map(([label, cnt]) =>
    `<div class="risk-type-row">
      <span class="action-tag at-${label}" style="font-size:10px">${label.replace("_"," ")}</span>
      <span class="rt-count">${cnt}</span>
    </div>`
  ).join("");
}

/* ── interactions ───────────────────────────────────────────────────────────── */
function toggleCard(id) {
  if (expandedCards.has(id)) { expandedCards.delete(id); }
  else { expandedCards.add(id); }
  renderActions();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll(".stat").forEach(el => el.classList.remove("active"));
  const map = { IMMEDIATE: 0, "30-DAY": 1, "90-DAY": 2, MONITOR: 3, ALL: 4 };
  document.querySelectorAll(".stat")[map[f]]?.classList.add("active");
  renderActions();
}

function exportCSV() {
  const rows = [["Urgency","Supplier","Tier","Country","Revenue at Risk (€M)","Risk Flags","Recommended Actions","Deadline","Status"]];
  ACTIONS.forEach(a => rows.push([
    a.urgency, a.supplier, a.tier, a.country, a.revenue_at_risk_m,
    a.risk_flags.map(f => f.label).join(";"),
    a.actions.join(";"), a.deadline || "", a.status
  ]));
  const csv = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "procurement_action_plan.csv"; a.click();
}

init();
</script>
</body>
</html>
