<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SupplyLens — Carbon &amp; CBAM Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0d14; color: #e2e8f0; }

.hdr { background: #111827; border-bottom: 1px solid #1e293b; padding: 14px 24px; display: flex; align-items: center; gap: 20px; }
.hdr h1 { font-size: 1.05rem; font-weight: 600; }
.hdr .sub { font-size: 0.78rem; color: #64748b; }

.stat-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 16px 24px; background: #111827; border-bottom: 1px solid #1e293b; }
.stat-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px 14px; }
.stat-card .sv { font-size: 1.25rem; font-weight: 700; color: #f1f5f9; }
.stat-card .sl { font-size: 0.68rem; color: #64748b; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.06em; }

.content { display: grid; grid-template-columns: 1fr 380px; gap: 0; height: calc(100vh - 160px); }

/* Left: chart area */
.chart-area { padding: 20px 24px; overflow-y: auto; }
.chart-area h2 { font-size: 0.82rem; font-weight: 700; color: #94a3b8; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }

.controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.ctrl-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 6px; padding: 5px 12px; font-size: 0.78rem; cursor: pointer; }
.ctrl-btn.active { background: #1d4ed8; color: #fff; border-color: #2563eb; }

svg text { font-family: 'Segoe UI', system-ui, sans-serif; }

/* Right: sidebar */
.sidebar { background: #111827; border-left: 1px solid #1e293b; padding: 20px 18px; overflow-y: auto; }
.sidebar h3 { font-size: 0.78rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }

.supplier-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s; }
.supplier-card:hover { border-color: #60a5fa; }
.supplier-card.selected { border-color: #3b82f6; }
.supplier-card .sc-name { font-size: 0.82rem; font-weight: 600; color: #f1f5f9; }
.supplier-card .sc-meta { font-size: 0.68rem; color: #64748b; margin-top: 2px; }

.scope-bar-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 0.68rem; }
.scope-bar-row .slabel { width: 50px; color: #64748b; }
.scope-track { flex: 1; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
.scope-fill { height: 100%; border-radius: 3px; }
.scope-bar-row .sval { width: 48px; text-align: right; color: #cbd5e1; font-size: 0.66rem; }

.badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.62rem; font-weight: 700; margin-left: 4px; }
.badge-sbti-15 { background: #14532d; color: #86efac; }
.badge-sbti-wbf2 { background: #1e3a8a; color: #93c5fd; }
.badge-sbti-2c { background: #713f12; color: #fde68a; }
.badge-sbti-committed { background: #1e293b; color: #94a3b8; }
.badge-sbti-none { background: #450a0a; color: #fca5a5; }
.badge-cdp-a { background: #14532d; color: #86efac; }
.badge-cdp-b { background: #1e3a8a; color: #93c5fd; }
.badge-cdp-c { background: #713f12; color: #fde68a; }
.badge-cdp-d { background: #7f1d1d; color: #fca5a5; }
.badge-cdp-f { background: #450a0a; color: #f87171; }
.badge-cbam { background: #083344; color: #67e8f9; }

.detail-panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 14px; }
.detail-panel .dp-name { font-size: 0.9rem; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; }
.dp-row { display: flex; justify-content: space-between; font-size: 0.72rem; color: #94a3b8; margin-bottom: 5px; }
.dp-row .dv { color: #e2e8f0; font-weight: 600; }
.dp-divider { border-top: 1px solid #1e293b; margin: 10px 0; }
.on-track-yes { color: #4ade80; }
.on-track-no { color: #f87171; }
.on-track-na { color: #64748b; }

/* CBAM estimator */
.cbam-box { background: #083344; border: 1px solid #164e63; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.cbam-box .cbam-title { font-size: 0.72rem; font-weight: 700; color: #67e8f9; margin-bottom: 8px; }
.cbam-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: #7dd3fc; margin-bottom: 4px; }
.cbam-total { font-size: 0.9rem; font-weight: 700; color: #67e8f9; margin-top: 6px; }

/* YoY trend indicator */
.trend-up { color: #f87171; }
.trend-dn { color: #4ade80; }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div style="font-size:0.65rem;color:#475569;text-transform:uppercase;letter-spacing:0.08em">SupplyLens</div>
    <h1>Carbon &amp; CBAM Tracker</h1>
  </div>
  <div class="sub">Scope 1/2/3 emissions · EU CBAM liability · SBTi / CDP alignment</div>
</div>

<div class="stat-row" id="stat-row"></div>

<div class="content">
  <div class="chart-area">
    <div class="controls">
      <button class="ctrl-btn active" id="btn-s12" onclick="setMode('scope12')">Scope 1+2</button>
      <button class="ctrl-btn" id="btn-s3" onclick="setMode('scope3')">Scope 3</button>
      <button class="ctrl-btn" id="btn-intensity" onclick="setMode('intensity')">CO₂ Intensity</button>
      <button class="ctrl-btn" id="btn-cbam" onclick="setMode('cbam')">CBAM Cost</button>
      <button class="ctrl-btn" id="btn-yoy" onclick="setMode('yoy')">YoY Trend</button>
    </div>
    <h2 id="chart-title">Scope 1 + 2 Emissions (ktCO₂e)</h2>
    <svg id="chart" width="100%" height="460"></svg>
  </div>

  <div class="sidebar">
    <div class="cbam-box" id="cbam-summary"></div>
    <h3>Suppliers</h3>
    <div id="supplier-list"></div>
  </div>
</div>

<script>
// ETS price EUR/tCO2
const ETS = { 2021:54, 2022:81, 2023:70, 2024:62, 2025:72, 2026:85 };
const CY = 2024;

const SUPPLIERS = [
  { name:"SSAB", country:"Sweden", tier:1, scope1:2100, scope2:420, scope3:3800, intensity:312,
    cbam_sector:"Steel", cbam_t:18000, cbam_co2pt:1.8, sbti:"1.5C", sbti_base:2018, sbti_target:2030,
    sbti_red:35, cdp:"A-", yoy:-4.2, revenue_beur:9.8 },
  { name:"ZF Friedrichshafen", country:"Germany", tier:1, scope1:830, scope2:1240, scope3:18400, intensity:91,
    cbam_sector:null, cbam_t:null, cbam_co2pt:null, sbti:"Well-below 2C", sbti_base:2019, sbti_target:2030,
    sbti_red:30, cdp:"B", yoy:-3.1, revenue_beur:43.8 },
  { name:"CATL", country:"China", tier:1, scope1:2450, scope2:8900, scope3:42000, intensity:245,
    cbam_sector:null, cbam_t:null, cbam_co2pt:null, sbti:"Committed", sbti_base:null, sbti_target:2035,
    sbti_red:null, cdp:"C", yoy:+2.8, revenue_beur:38.7 },
  { name:"TSMC", country:"Taiwan", tier:1, scope1:189, scope2:14200, scope3:2100, intensity:195,
    cbam_sector:null, cbam_t:null, cbam_co2pt:null, sbti:"Well-below 2C", sbti_base:2020, sbti_target:2030,
    sbti_red:25, cdp:"A-", yoy:-1.8, revenue_beur:69.3 },
  { name:"Bosch", country:"Germany", tier:1, scope1:410, scope2:890, scope3:32000, intensity:52,
    cbam_sector:null, cbam_t:null, cbam_co2pt:null, sbti:"1.5C", sbti_base:2018, sbti_target:2030,
    sbti_red:40, cdp:"A", yoy:-6.1, revenue_beur:91.6 },
  { name:"Norilsk Nickel", country:"Russia", tier:2, scope1:9800, scope2:3200, scope3:null, intensity:880,
    cbam_sector:null, cbam_t:null, cbam_co2pt:null, sbti:"None", sbti_base:null, sbti_target:null,
    sbti_red:null, cdp:"D", yoy:+1.2, revenue_beur:14.8 },
  { name:"Glencore DRC", country:"DRC", tier:3, scope1:1100, scope2:280, scope3:null, intensity:740,
    cbam_sector:null, cbam_t:null, cbam_co2pt:null, sbti:"None", sbti_base:null, sbti_target:null,
    sbti_red:null, cdp:"D", yoy:+3.5, revenue_beur:1.9 },
  { name:"LKAB", country:"Sweden", tier:2, scope1:1920, scope2:180, scope3:null, intensity:820,
    cbam_sector:"Iron", cbam_t:null, cbam_co2pt:8.5, sbti:"1.5C", sbti_base:2020, sbti_target:2035,
    sbti_red:50, cdp:"A-", yoy:-2.1, revenue_beur:4.2 },
  { name:"Saarstahl AG", country:"Germany", tier:2, scope1:3400, scope2:420, scope3:null, intensity:540,
    cbam_sector:"Steel", cbam_t:8500, cbam_co2pt:1.92, sbti:"2C", sbti_base:2019, sbti_target:2030,
    sbti_red:20, cdp:"C", yoy:-1.5, revenue_beur:5.1 },
  { name:"Infineon Technologies", country:"Germany", tier:2, scope1:142, scope2:1860, scope3:8900, intensity:128,
    cbam_sector:null, cbam_t:null, cbam_co2pt:null, sbti:"1.5C", sbti_base:2019, sbti_target:2030,
    sbti_red:70, cdp:"A", yoy:-8.2, revenue_beur:14.5 },
  { name:"Thaisarco", country:"Thailand", tier:3, scope1:95, scope2:210, scope3:null, intensity:420,
    cbam_sector:null, cbam_t:null, cbam_co2pt:null, sbti:"None", sbti_base:null, sbti_target:null,
    sbti_red:null, cdp:"C", yoy:+0.8, revenue_beur:0.7 },
  { name:"China Rare Earth Group", country:"China", tier:4, scope1:4800, scope2:2200, scope3:null, intensity:950,
    cbam_sector:null, cbam_t:null, cbam_co2pt:null, sbti:"None", sbti_base:null, sbti_target:null,
    sbti_red:null, cdp:"F", yoy:+4.1, revenue_beur:7.2 },
];

// ── CBAM calculation ─────────────────────────────────────────
function cbamCost(s, year=CY) {
  if (!s.cbam_sector || !s.cbam_t) return null;
  return s.cbam_t * (s.cbam_co2pt||0) * (ETS[year]||ETS[CY]);
}

function sbtiOnTrack(s) {
  if (!s.sbti_red || s.sbti==="None"||s.sbti==="Committed") return null;
  const totalYrs = (s.sbti_target||2030) - (s.sbti_base||2020);
  const reqAnnual = s.sbti_red / totalYrs;
  return s.yoy <= -reqAnnual;
}

// ── Stats row ────────────────────────────────────────────────
function buildStats() {
  const totalS12 = SUPPLIERS.reduce((a,s)=>a+s.scope1+s.scope2,0);
  const totalS3  = SUPPLIERS.reduce((a,s)=>a+(s.scope3||0),0);
  const cbamTotal= SUPPLIERS.reduce((a,s)=>a+(cbamCost(s)||0),0);
  const sbtiCount= SUPPLIERS.filter(s=>s.sbti!=="None").length;
  const cdpA     = SUPPLIERS.filter(s=>s.cdp==="A"||s.cdp==="A-").length;
  const risers   = SUPPLIERS.filter(s=>s.yoy>0).length;

  const stats = [
    { v: `${(totalS12/1000).toFixed(1)} MtCO₂`, l: "Scope 1+2 Total" },
    { v: `${(totalS3/1000).toFixed(1)} MtCO₂`, l: "Scope 3 Total" },
    { v: `€${(cbamTotal/1000).toFixed(0)}k`, l: "CBAM Liability 2024" },
    { v: `${sbtiCount}/${SUPPLIERS.length}`, l: "SBTi Committed" },
    { v: `${cdpA}/${SUPPLIERS.length}`, l: "CDP A/A- Rated" },
    { v: risers, l: "Emissions Rising" },
  ];
  const row = document.getElementById("stat-row");
  row.innerHTML = stats.map(s=>`<div class="stat-card"><div class="sv">${s.v}</div><div class="sl">${s.l}</div></div>`).join("");
}

// ── Chart ────────────────────────────────────────────────────
let mode = "scope12";
const SCOPE1_C = "#6366f1", SCOPE2_C = "#22d3ee", SCOPE3_C = "#a78bfa";
const CBAM_C = "#06b6d4";

function setMode(m) {
  mode = m;
  document.querySelectorAll(".ctrl-btn").forEach(b=>b.classList.remove("active"));
  const map = { scope12:"btn-s12", scope3:"btn-s3", intensity:"btn-intensity", cbam:"btn-cbam", yoy:"btn-yoy" };
  document.getElementById(map[m]).classList.add("active");
  const titles = { scope12:"Scope 1+2 Emissions (ktCO₂e)", scope3:"Scope 3 Emissions (ktCO₂e)",
    intensity:"Carbon Intensity (tCO₂ per €1M revenue)", cbam:"Estimated CBAM Certificate Cost (EUR)",
    yoy:"Year-on-Year Emissions Change (%)" };
  document.getElementById("chart-title").textContent = titles[m];
  drawChart();
}

function drawChart() {
  const svg = d3.select("#chart");
  svg.selectAll("*").remove();
  const W = svg.node().clientWidth || 700;
  const H = 460;
  const margin = { top: 20, right: 20, bottom: 100, left: 80 };
  const width = W - margin.left - margin.right;
  const height = H - margin.top - margin.bottom;
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  let data = [];
  if (mode === "scope12") {
    data = SUPPLIERS.map(s=>({ name:s.name, v1:s.scope1, v2:s.scope2 }))
                    .sort((a,b)=>b.v1+b.v2-a.v1-a.v2);
  } else if (mode === "scope3") {
    data = SUPPLIERS.filter(s=>s.scope3).map(s=>({ name:s.name, v:s.scope3 }))
                    .sort((a,b)=>b.v-a.v);
  } else if (mode === "intensity") {
    data = SUPPLIERS.map(s=>({ name:s.name, v:s.intensity })).sort((a,b)=>b.v-a.v);
  } else if (mode === "cbam") {
    data = SUPPLIERS.filter(s=>cbamCost(s)!=null).map(s=>({ name:s.name, v:cbamCost(s) })).sort((a,b)=>b.v-a.v);
  } else if (mode === "yoy") {
    data = SUPPLIERS.map(s=>({ name:s.name, v:s.yoy })).sort((a,b)=>a.v-b.v);
  }

  const names = data.map(d=>d.name);
  const x = d3.scaleBand().domain(names).range([0,width]).padding(0.25);

  if (mode === "scope12") {
    const maxV = d3.max(data, d=>d.v1+d.v2);
    const y = d3.scaleLinear().domain([0, maxV*1.1]).range([height,0]);
    g.append("g").attr("transform",`translate(0,${height})`).call(d3.axisBottom(x).tickSize(0))
      .selectAll("text").attr("transform","rotate(-45)").attr("text-anchor","end").attr("fill","#64748b").attr("font-size","10");
    g.append("g").call(d3.axisLeft(y).ticks(5).tickFormat(d=>d3.format(".0s")(d)+"t"))
      .selectAll("text").attr("fill","#64748b").attr("font-size","10");
    g.selectAll(".domain, .tick line").attr("stroke","#1e293b");

    data.forEach(d=>{
      const bx = x(d.name);
      const bw = x.bandwidth();
      g.append("rect").attr("x",bx).attr("y",y(d.v1+d.v2)).attr("width",bw).attr("height",y(0)-y(d.v1+d.v2)).attr("fill",SCOPE2_C).attr("rx",2);
      g.append("rect").attr("x",bx).attr("y",y(d.v1)).attr("width",bw).attr("height",y(0)-y(d.v1)).attr("fill",SCOPE1_C).attr("rx",2);
    });
    // Legend
    const ld = [{c:SCOPE1_C,l:"Scope 1"},{c:SCOPE2_C,l:"Scope 2"}];
    ld.forEach((l,i)=>{
      const gx = width - 100 + i*0;
      g.append("rect").attr("x",10+i*80).attr("y",-16).attr("width",10).attr("height",10).attr("fill",l.c).attr("rx",2);
      g.append("text").attr("x",24+i*80).attr("y",-7).attr("fill","#94a3b8").attr("font-size","10").text(l.l);
    });
  } else if (mode==="yoy") {
    const ext = d3.extent(data,d=>d.v);
    const y = d3.scaleLinear().domain([Math.min(ext[0]*1.2,-2), Math.max(ext[1]*1.2,2)]).range([height,0]);
    g.append("line").attr("x1",0).attr("x2",width).attr("y1",y(0)).attr("y2",y(0)).attr("stroke","#475569").attr("stroke-dasharray","4");
    g.append("g").attr("transform",`translate(0,${height})`).call(d3.axisBottom(x).tickSize(0))
      .selectAll("text").attr("transform","rotate(-45)").attr("text-anchor","end").attr("fill","#64748b").attr("font-size","10");
    g.append("g").call(d3.axisLeft(y).ticks(5).tickFormat(d=>d+"%")).selectAll("text").attr("fill","#64748b").attr("font-size","10");
    data.forEach(d=>{
      const up = d.v > 0;
      const bh = Math.abs(y(d.v)-y(0));
      g.append("rect").attr("x",x(d.name)).attr("y",up?y(d.v):y(0)).attr("width",x.bandwidth()).attr("height",bh)
        .attr("fill",up?"#ef4444":"#22c55e").attr("rx",2).attr("opacity",0.85);
    });
  } else {
    const maxV = d3.max(data,d=>d.v);
    const y = d3.scaleLinear().domain([0, maxV*1.1]).range([height,0]);
    const color = mode==="cbam" ? CBAM_C : mode==="intensity" ? "#f59e0b" : SCOPE3_C;
    g.append("g").attr("transform",`translate(0,${height})`).call(d3.axisBottom(x).tickSize(0))
      .selectAll("text").attr("transform","rotate(-45)").attr("text-anchor","end").attr("fill","#64748b").attr("font-size","10");
    g.append("g").call(d3.axisLeft(y).ticks(5).tickFormat(d=>d3.format(".2s")(d))).selectAll("text").attr("fill","#64748b").attr("font-size","10");
    g.selectAll(".domain, .tick line").attr("stroke","#1e293b");
    data.forEach(d=>{
      g.append("rect").attr("x",x(d.name)).attr("y",y(d.v)).attr("width",x.bandwidth()).attr("height",y(0)-y(d.v)).attr("fill",color).attr("rx",2).attr("opacity",0.85);
    });
  }
}

// ── Sidebar ──────────────────────────────────────────────────
let selectedSupplier = null;

function sbtiClass(s) {
  const map={"1.5C":"badge-sbti-15","Well-below 2C":"badge-sbti-wbf2","2C":"badge-sbti-2c","Committed":"badge-sbti-committed","None":"badge-sbti-none"};
  return map[s]||"badge-sbti-none";
}
function cdpClass(c) {
  if(!c)return"badge-cdp-d";
  const m={"A":"badge-cdp-a","A-":"badge-cdp-a","B":"badge-cdp-b","C":"badge-cdp-c","D":"badge-cdp-d","F":"badge-cdp-f"};
  return m[c]||"badge-cdp-d";
}

function buildSidebar() {
  // CBAM summary
  const cbamItems = SUPPLIERS.filter(s=>cbamCost(s)!=null);
  const cbamTotal = cbamItems.reduce((a,s)=>a+(cbamCost(s)||0),0);
  document.getElementById("cbam-summary").innerHTML = `
    <div class="cbam-title">CBAM Liability Estimate (${CY})</div>
    ${cbamItems.map(s=>`<div class="cbam-row"><span>${s.name}</span><span>€${(cbamCost(s)/1000).toFixed(0)}k</span></div>`).join("")}
    <div class="cbam-total">Total: €${(cbamTotal/1000).toFixed(0)}k/yr @ €${ETS[CY]}/tCO₂</div>
  `;

  const sorted = [...SUPPLIERS].sort((a,b)=>(b.scope1+b.scope2)-(a.scope1+a.scope2));
  const maxS12 = d3.max(sorted,s=>s.scope1+s.scope2);
  const maxS3  = d3.max(sorted,s=>s.scope3||0);

  const list = document.getElementById("supplier-list");
  list.innerHTML = sorted.map(s=>{
    const track = sbtiOnTrack(s);
    const trackStr = track===true?"<span class='on-track-yes'>✓ On track</span>" : track===false?"<span class='on-track-no'>✗ Behind</span>" : "<span class='on-track-na'>—</span>";
    return `<div class="supplier-card" id="sc-${s.name.replace(/\s/g,'_')}" onclick="selectSupplier('${s.name}')">
      <div class="sc-name">${s.name}
        <span class="badge ${sbtiClass(s.sbti)}">${s.sbti}</span>
        <span class="badge ${cdpClass(s.cdp)}">CDP ${s.cdp||"—"}</span>
        ${cbamCost(s)?`<span class="badge badge-cbam">CBAM</span>`:""}
      </div>
      <div class="sc-meta">${s.country} · T${s.tier} · YoY <span class="${s.yoy>0?'trend-up':'trend-dn'}">${s.yoy>0?'+':''}${s.yoy}%</span></div>
      <div class="scope-bar-row"><span class="slabel">Scope 1</span><div class="scope-track"><div class="scope-fill" style="width:${(s.scope1/maxS12*100).toFixed(0)}%;background:#6366f1"></div></div><span class="sval">${s.scope1}kt</span></div>
      <div class="scope-bar-row"><span class="slabel">Scope 2</span><div class="scope-track"><div class="scope-fill" style="width:${(s.scope2/maxS12*100).toFixed(0)}%;background:#22d3ee"></div></div><span class="sval">${s.scope2}kt</span></div>
      ${s.scope3?`<div class="scope-bar-row"><span class="slabel">Scope 3</span><div class="scope-track"><div class="scope-fill" style="width:${(s.scope3/Math.max(maxS3,1)*100).toFixed(0)}%;background:#a78bfa"></div></div><span class="sval">${(s.scope3/1000).toFixed(1)}Mt</span></div>`:""}
      <div style="font-size:0.64rem;color:#64748b;margin-top:4px">SBTi: ${trackStr}</div>
    </div>`;
  }).join("");
}

function selectSupplier(name) {
  selectedSupplier = name;
}

// ── Init ─────────────────────────────────────────────────────
buildStats();
buildSidebar();
drawChart();
window.addEventListener("resize", drawChart);
</script>
