<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supplier Deep Dive — SupplyLens</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; font-size: 13px; }

  .header { background: #1a1d2e; border-bottom: 1px solid #2d3748; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .header h1 { font-size: 16px; color: #a78bfa; font-weight: 600; }
  .sel-wrap { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .sel-wrap label { color: #718096; font-size: 12px; }
  select { background: #1a1d2e; color: #e2e8f0; border: 1px solid #4a5568; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  select:focus { outline: none; border-color: #a78bfa; }

  .hero { background: linear-gradient(135deg, #1a1d2e, #141720); border-bottom: 1px solid #2d3748; padding: 18px 24px; display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .hero-left { flex: 1; min-width: 260px; }
  .supplier-name { font-size: 22px; font-weight: 700; color: #f7fafc; }
  .supplier-sub  { color: #718096; margin-top: 4px; font-size: 13px; }
  .flags-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .risk-flag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; }
  .flag-CRITICAL  { background: #742a2a; color: #feb2b2; }
  .flag-HIGH      { background: #7b341e; color: #fed7aa; }
  .flag-MEDIUM    { background: #1a365d; color: #bee3f8; }
  .flag-LOW       { background: #1a4731; color: #9ae6b4; }
  .hero-right { display: flex; gap: 12px; flex-wrap: wrap; }
  .kpi-card { background: #0f1117; border: 1px solid #2d3748; border-radius: 8px; padding: 12px 18px; text-align: center; min-width: 110px; }
  .kpi-num  { font-size: 20px; font-weight: 700; }
  .kpi-label { font-size: 11px; color: #718096; margin-top: 2px; }
  .risk-score-ring { position: relative; width: 56px; height: 56px; margin: 0 auto 4px; }
  .risk-score-ring svg { transform: rotate(-90deg); }
  .risk-score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 14px; font-weight: 700; }

  .body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .col { padding: 16px 20px; }
  .col:first-child { border-right: 1px solid #2d3748; }

  .section { margin-bottom: 22px; }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #718096; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #2d3748; }

  /* Financial bars */
  .metric-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .metric-label { width: 110px; color: #94a3b8; font-size: 12px; flex-shrink: 0; }
  .bar-track { flex: 1; height: 8px; background: #2d3748; border-radius: 4px; position: relative; overflow: visible; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .bar-val { width: 50px; text-align: right; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .threshold-line { position: absolute; top: -3px; bottom: -3px; width: 2px; z-index: 2; }
  .metric-zone { font-size: 10px; padding: 1px 6px; border-radius: 3px; flex-shrink: 0; }

  /* Rating */
  .rating-grid { display: flex; gap: 6px; flex-wrap: wrap; }
  .rating-chip { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .r-IG { background: #1a4731; color: #6ee7b7; }
  .r-HY { background: #7b341e; color: #fed7aa; }
  .r-NR { background: #2d3748; color: #94a3b8; }
  .r-D  { background: #742a2a; color: #feb2b2; }

  /* Events */
  .event-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #2d3748; }
  .event-row:last-child { border-bottom: none; }
  .event-sev { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .sev-CRITICAL { background: #f56565; }
  .sev-HIGH { background: #ed8936; }
  .sev-MEDIUM { background: #4299e1; }
  .sev-LOW { background: #48bb78; }
  .event-name { font-size: 12px; color: #e2e8f0; }
  .event-impact { font-size: 11px; color: #718096; }
  .event-date  { font-size: 11px; color: #4a5568; margin-left: auto; white-space: nowrap; }

  /* Logistics */
  .route-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; background: #1a1d2e; border-radius: 6px; margin: 3px; font-size: 12px; border-left: 3px solid; }
  .route-chip.exposed { border-color: #ed8936; }
  .route-chip.critical { border-color: #f56565; }
  .route-chip.ok { border-color: #48bb78; }
  .route-prob { font-size: 10px; color: #718096; }

  /* Evidence */
  .ev-claim { padding: 8px 10px; background: #1a1d2e; border-radius: 6px; margin-bottom: 6px; border-left: 3px solid; }
  .ev-claim.reviewed { border-color: #48bb78; }
  .ev-claim.pending  { border-color: #4299e1; }
  .ev-claim.inferred { border-color: #9f7aea; }
  .ev-doc   { font-size: 11px; color: #718096; margin-top: 3px; }
  .ev-conf  { font-size: 10px; float: right; color: #94a3b8; }
  .ev-text  { font-size: 12px; color: #cbd5e0; }

  /* Alt suppliers */
  .alt-row { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #2d3748; }
  .alt-row:last-child { border-bottom: none; }
  .alt-name { flex: 1; font-size: 12px; }
  .action-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px; }
  .SWITCH_NOW { background: #742a2a; color: #feb2b2; }
  .DUAL_SOURCE { background: #7b341e; color: #fed7aa; }
  .EVALUATE { background: #1a365d; color: #bee3f8; }
  .score-bar { width: 60px; height: 6px; background: #2d3748; border-radius: 3px; overflow: hidden; }
  .score-fill { height: 100%; background: #48bb78; border-radius: 3px; }

  /* Compliance */
  .comp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .comp-cell { padding: 6px 8px; background: #1a1d2e; border-radius: 5px; font-size: 11px; text-align: center; }
  .comp-cell.pass { border-top: 2px solid #48bb78; color: #68d391; }
  .comp-cell.fail { border-top: 2px solid #f56565; color: #fc8181; }
  .comp-cell.na   { border-top: 2px solid #4a5568; color: #718096; }
  .comp-name { font-size: 10px; color: #94a3b8; margin-top: 2px; }

  @media (max-width: 768px) {
    .body { grid-template-columns: 1fr; }
    .col:first-child { border-right: none; border-bottom: 1px solid #2d3748; }
  }
</style>
</head>
<body>

    </div>
  </div>

  <div class="col">

    <!-- Alt suppliers -->
    <div class="section">
      <div class="section-title">Alternative Suppliers</div>
      <div id="alts-list"></div>
    </div>
  </div>
</div>

/* ── helpers ─────────────────────────────────────────────────────────────────*/
const FLAG_LEVELS = { SANCTIONS_OFAC: "CRITICAL", DISTRESS: "CRITICAL", EXPORT_CTRL: "CRITICAL",
                      FORCE_MAJEURE: "CRITICAL", SINGLE_SOURCE: "HIGH", GEOPOLITICAL_RISK: "HIGH",
                      UFLPA_RISK: "HIGH", FINANCIAL_STRESS: "HIGH", CBAM_EXPOSURE: "HIGH",
                      STARTUP_RISK: "MEDIUM", CARBON_RISK: "MEDIUM", STRATEGIC_MATERIAL: "HIGH", WATER_STRESS: "MEDIUM" };

function flagClass(f, levels) {
  const lv = (levels && levels[f]) || FLAG_LEVELS[f] || "LOW";
  return `flag-${lv}`;
}

function zColor(z) {
  return z < 1.81 ? "#f56565" : z < 2.99 ? "#ed8936" : "#48bb78";
}

function zZone(z) {
  return z < 1.81 ? "Distress" : z < 2.99 ? "Grey" : "Safe";
}

function zZoneStyle(z) {
  const c = z < 1.81 ? "#742a2a:#feb2b2" : z < 2.99 ? "#7b341e:#fed7aa" : "#1a4731:#9ae6b4";
  const [bg, fg] = c.split(":");
  return `background:${bg};color:${fg}`;
}

function ndColor(nd) {
  return nd > 5.5 ? "#f56565" : nd > 4.0 ? "#ed8936" : "#4299e1";
}

function ndZone(nd) {
  return nd > 5.5 ? "Alert" : nd > 4.0 ? "Watch" : "OK";
}

function ratingClass(r) {
  if (!r || r === "NR") return "r-NR";
  if (r.startsWith("D") || r === "CCC") return "r-D";
  if (r.startsWith("A") || r.startsWith("B") && r.includes("B")) return "r-IG";
  return "r-HY";
}

/* ── populate selector ────────────────────────────────────────────────────── */
function buildSelect() {
  const sel = document.getElementById("supplier-sel");
  Object.keys(SUPPLIERS).forEach(name => {
    const opt = document.createElement("option");
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  selectSupplier(Object.keys(SUPPLIERS)[0]);
}

/* ── render supplier ─────────────────────────────────────────────────────────*/
function selectSupplier(name) {
  const s = SUPPLIERS[name];
  if (!s) return;

  // Header
  document.getElementById("h-name").textContent = name;
  document.getElementById("h-sub").textContent = `T${s.tier} · ${s.country} · ${s.industry}`;
  document.getElementById("h-tier").textContent = `T${s.tier}`;
  document.getElementById("h-contract").textContent = s.contract_value_m.toFixed(0);
  document.getElementById("h-altman").textContent = s.altman_z.toFixed(1);
  document.getElementById("h-altman").style.color = zColor(s.altman_z);
  document.getElementById("h-evidence").textContent = s.evidence_count;
  document.getElementById("h-risk-score").textContent = s.risk_score;

  // Risk score ring
  const circ = 138.2;
  const offset = circ - (circ * s.risk_score / 100);
  const ring = document.getElementById("ring-fill");
  ring.style.strokeDashoffset = offset;
  ring.style.stroke = s.risk_score > 70 ? "#f56565" : s.risk_score > 40 ? "#ed8936" : "#48bb78";

  // Risk flags
  document.getElementById("h-flags").innerHTML =
    (s.risk_flags.length ? s.risk_flags : ["No current risk flags"]).map(f =>
      s.risk_flags.length
        ? `<span class="risk-flag ${flagClass(f, s.flag_levels)}">${f}</span>`
        : `<span style="color:#4a5568;font-size:12px">${f}</span>`
    ).join("");

  // Financial
  const maxZ = 5.0, maxND = 7.0;
  const barZ = document.getElementById("bar-z");
  barZ.style.width = Math.min(100, s.altman_z / maxZ * 100) + "%";
  barZ.style.background = zColor(s.altman_z);
  document.getElementById("val-z").textContent = s.altman_z.toFixed(2);
  document.getElementById("val-z").style.color = zColor(s.altman_z);
  document.getElementById("zone-z").textContent = zZone(s.altman_z);
  document.getElementById("zone-z").style = zZoneStyle(s.altman_z) + ";padding:2px 6px;border-radius:3px;font-size:10px";

  const barND = document.getElementById("bar-nd");
  barND.style.width = Math.min(100, s.nd_ebitda / maxND * 100) + "%";
  barND.style.background = ndColor(s.nd_ebitda);
  document.getElementById("val-nd").textContent = s.nd_ebitda.toFixed(1) + "×";
  document.getElementById("val-nd").style.color = ndColor(s.nd_ebitda);
  document.getElementById("zone-nd").textContent = ndZone(s.nd_ebitda);
  document.getElementById("zone-nd").style = `background:${ndColor(s.nd_ebitda)}22;color:${ndColor(s.nd_ebitda)};padding:2px 6px;border-radius:3px;font-size:10px`;

  document.getElementById("rating-row").innerHTML = `
    <div class="rating-chip ${ratingClass(s.credit_rating)}">${s.credit_rating}</div>
    <div style="color:#718096;font-size:11px;align-self:center">
      ${s.credit_rating === "NR" ? "Not Rated" : ratingClass(s.credit_rating) === "r-IG" ? "Investment Grade" : "Sub-Investment Grade"}
    </div>`;

  // Events
  document.getElementById("events-list").innerHTML = s.events.length
    ? s.events.map(e => `
        <div class="event-row">
          <div class="event-sev sev-${e.severity}"></div>
          <div>
            <div class="event-name">${e.name}</div>
            <div class="event-impact">${e.impact}</div>
          </div>
          <div class="event-date">${e.date}</div>
        </div>`).join("")
    : '<div style="color:#4a5568;font-size:12px">No events recorded</div>';

  // Compliance
  const comp = s.certifications;
  const comps = [
    { key: "ISO 9001", label: "ISO 9001" },
    { key: "ISO 14001", label: "ISO 14001" },
    { key: "REACH", label: "REACH" },
    { key: "UFLPA", label: "UFLPA OK" },
    { key: "CBAM", label: "CBAM Calc" },
    { key: "LkSG", label: "LkSG" },
  ];
  document.getElementById("comp-grid").innerHTML = comps.map(c => {
    const v = comp[c.key];
    const cls = v === true ? "pass" : v === false ? "fail" : "na";
    const icon = v === true ? "✓" : v === false ? "✗" : "—";
    return `<div class="comp-cell ${cls}"><div>${icon}</div><div class="comp-name">${c.label}</div></div>`;
  }).join("");

  // Logistics
  document.getElementById("logistics-list").innerHTML = s.logistics.map(r =>
    `<div class="route-chip ${r.status}">
      <span>${r.route}</span>
      <span class="route-prob">${Math.round(r.prob*100)}% disruption prob</span>
    </div>`
  ).join("") || '<div style="color:#4a5568;font-size:12px">No logistics data</div>';

  // Evidence
  document.getElementById("evidence-list").innerHTML = s.evidence.map(e =>
    `<div class="ev-claim ${e.status}">
      <div class="ev-text"><span class="ev-conf">${Math.round(e.confidence*100)}% confidence</span>${e.text}</div>
      <div class="ev-doc">📄 ${e.doc}</div>
    </div>`
  ).join("") || '<div style="color:#4a5568;font-size:12px">No evidence claims</div>';

  // Alts
  document.getElementById("alts-list").innerHTML = s.alts.length
    ? s.alts.map(a =>
        `<div class="alt-row">
          <span class="alt-name">${a.name}</span>
          <div class="score-bar"><div class="score-fill" style="width:${a.score}%"></div></div>
          <span style="color:#718096;font-size:11px;width:32px;text-align:right">${a.score}</span>
          <span class="action-badge ${a.action}">${a.action.replace("_"," ")}</span>
        </div>`
      ).join("")
    : '<div style="color:#4a5568;font-size:12px">No alternatives mapped</div>';
}

buildSelect();
</script>
