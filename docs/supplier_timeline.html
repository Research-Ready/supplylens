<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supplier Risk Timeline — SupplyLens</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; font-size: 13px; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  .header { background: #1a1d2e; border-bottom: 1px solid #2d3748; padding: 10px 18px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; flex-wrap: wrap; }
  .header h1 { font-size: 15px; color: #a78bfa; font-weight: 600; }

  .controls { display: flex; gap: 8px; padding: 8px 18px; background: #141720; border-bottom: 1px solid #2d3748; flex-shrink: 0; flex-wrap: wrap; align-items: center; }
  .ctrl-group { display: flex; gap: 5px; align-items: center; }
  .ctrl-label { font-size: 11px; color: #718096; margin-right: 2px; }
  .pill { padding: 3px 10px; border-radius: 10px; border: 1px solid #2d3748; background: #1a1d2e; color: #718096; cursor: pointer; font-size: 11px; transition: all 0.12s; }
  .pill:hover, .pill.active { border-color: #a78bfa; color: #e2e8f0; background: #1a1230; }
  .pill.sev-CRITICAL.active { border-color: #f56565; color: #f56565; background: #2d1515; }
  .pill.sev-HIGH.active     { border-color: #ed8936; color: #ed8936; background: #2d1e10; }
  .pill.sev-MEDIUM.active   { border-color: #ecc94b; color: #ecc94b; background: #2d260f; }
  .range-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 11px; color: #718096; }
  input[type=range] { accent-color: #a78bfa; cursor: pointer; }

  .body { flex: 1; display: grid; grid-template-columns: 1fr 280px; overflow: hidden; }
  #chart-wrap { overflow-y: auto; overflow-x: hidden; padding: 12px 4px 12px 0; }
  .detail-panel { border-left: 1px solid #2d3748; background: #141720; overflow-y: auto; padding: 14px; }
  .dp-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #718096; margin-bottom: 10px; border-bottom: 1px solid #2d3748; padding-bottom: 6px; }
  .dp-event-name { font-size: 14px; font-weight: 600; color: #f7fafc; margin-bottom: 4px; }
  .dp-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid #1a1d2e; }
  .dp-row:last-child { border-bottom: none; }
  .dp-lbl { color: #718096; }
  .dp-val { color: #e2e8f0; }
  .dp-impact { font-size: 12px; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
  .dp-sev { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; }
  .sev-c-CRITICAL { background: #742a2a; color: #feb2b2; }
  .sev-c-HIGH     { background: #7b341e; color: #fed7aa; }
  .sev-c-MEDIUM   { background: #744210; color: #fefcbf; }
  .sev-c-LOW      { background: #1a4731; color: #9ae6b4; }
  .dp-suppliers { margin-top: 10px; }
  .dp-sup-chip { display: inline-block; background: #1a1d2e; border: 1px solid #2d3748; border-radius: 4px; padding: 2px 8px; font-size: 11px; color: #94a3b8; margin: 2px; }
  .placeholder { color: #4a5568; font-size: 12px; text-align: center; padding: 30px 0; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: #718096; }
  .leg-item { display: flex; align-items: center; gap: 5px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* SVG styles (injected inline) */
</style>
</head>
<body>
<div class="header">
  <h1>Supplier Risk Timeline</h1>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#f56565"></div>CRITICAL event</div>
    <div class="leg-item"><div class="leg-dot" style="background:#ed8936"></div>HIGH</div>
    <div class="leg-item"><div class="leg-dot" style="background:#ecc94b"></div>MEDIUM</div>
    <div class="leg-item"><div class="leg-dot" style="background:#48bb78"></div>LOW</div>
    <div class="leg-item"><div style="width:24px;height:6px;background:linear-gradient(to right,#f56565,#48bb78);border-radius:3px"></div>Altman Z background</div>
  </div>
</div>
<div class="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Severity:</span>
    <span class="pill sev-ALL active" onclick="toggleFilter('sev','ALL')">All</span>
    <span class="pill sev-CRITICAL" onclick="toggleFilter('sev','CRITICAL')">🔴 Critical</span>
    <span class="pill sev-HIGH" onclick="toggleFilter('sev','HIGH')">🟠 High</span>
    <span class="pill sev-MEDIUM" onclick="toggleFilter('sev','MEDIUM')">🟡 Medium</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Tier:</span>
    <span class="pill tier-ALL active" onclick="toggleFilter('tier','ALL')">All</span>
    <span class="pill tier-T1" onclick="toggleFilter('tier','T1')">T1</span>
    <span class="pill tier-T2" onclick="toggleFilter('tier','T2')">T2</span>
    <span class="pill tier-T3" onclick="toggleFilter('tier','T3')">T3+</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Type:</span>
    <span class="pill type-ALL active" onclick="toggleFilter('type','ALL')">All</span>
    <span class="pill type-FINANCIAL" onclick="toggleFilter('type','FINANCIAL')">Financial</span>
    <span class="pill type-GEOPOLITICAL" onclick="toggleFilter('type','GEOPOLITICAL')">Geopolitical</span>
    <span class="pill type-REGULATORY" onclick="toggleFilter('type','REGULATORY')">Regulatory</span>
    <span class="pill type-LOGISTICS" onclick="toggleFilter('type','LOGISTICS')">Logistics</span>
  </div>
  <div class="range-wrap">
    <span>2020</span>
    <input type="range" id="zoom-range" min="2020" max="2027" step="0.25" value="2021" oninput="setZoomStart(+this.value)">
    <span id="zoom-lbl">2021 →</span>
  </div>
</div>
<div class="body">
  <div id="chart-wrap"></div>
  <div class="detail-panel">
    <div class="dp-title">Event Detail</div>
    <div id="detail-content"><div class="placeholder">Click an event circle</div></div>
  </div>
</div>

<script>
/* ── data ──────────────────────────────────────────────────────────────────── */
const SUPPLIERS = [

  { name: "Michelin",             tier: 1, z: 3.3,  z_history: [[2022,3.4],[2023,3.3],[2024,3.3]] },

const EVENTS = [
  {
    id: "EVT-AUTO-CHIP-2021", date: "2021-03-01", name: "Auto Chip Shortage",
    type: "SUPPLY", severity: "HIGH", financial_impact_m: 220,
    description: "Global MLCC / MCU shortage halted auto production. Scania ECU delivery cut 20%.",
    affected: ["Bosch", "Infineon Technologies", "TSMC"],
  },
  {

  },

    description: "Chilean Constitutional Convention draft included lithium nationalization. SQM share price -18%.",

  },
  {

    description: "US DHS opened UFLPA investigation against CATL citing Xinjiang graphite sourcing.",

  },
  {
    id: "EVT-ASML-2023", date: "2023-01-20", name: "ASML China Export Restriction",
    type: "REGULATORY", severity: "CRITICAL", financial_impact_m: 340,
    description: "Netherlands/US blocked ASML from exporting DUV/EUV to China. TSMC capacity plans affected.",
    affected: ["TSMC", "JSR Corporation"],
  },
  {
    id: "EVT-JSR-NATION-2023", date: "2023-12-01", name: "JSR Nationalization (METI)",
    type: "REGULATORY", severity: "HIGH", financial_impact_m: 220,

    affected: ["JSR Corporation"],
  },
  {

    type: "REGULATORY", severity: "CRITICAL", financial_impact_m: 340,
    description: "US BIS blocked A100/H100 chip exports to China. TSMC/NVIDIA DRIVE Orin availability risk.",
    affected: ["TSMC"],
  },
  {
    id: "EVT-GRAPHITE-2023", date: "2023-10-20", name: "China Graphite Export Controls",
    type: "REGULATORY", severity: "HIGH", financial_impact_m: 185,
    description: "China imposed export licensing for all graphite. 68% of anode supply choked.",

    description: "Germany LkSG requires cobalt due diligence audit from Jan 2024. Glencore/CATL chain.",

    description: "ZF Altman Z dropped 2.8→1.95. ND/EBITDA rose to 4.8×. FINANCIAL_STRESS flag triggered.",
    affected: ["ZF Friedrichshafen"],
  },
  {
    id: "EVT-CBAM-2024", date: "2024-10-01", name: "EU CBAM Reporting Phase",
    type: "REGULATORY", severity: "MEDIUM", financial_impact_m: 38,
    description: "EU Carbon Border Adjustment Mechanism reporting mandatory. SSAB steel cost impact ~€8/tonne.",
    affected: ["SSAB"],
  },
  {
    id: "EVT-SYRAH-DISTRESS-2024", date: "2024-06-01", name: "Syrah Resources Financial Distress",
    type: "FINANCIAL", severity: "HIGH", financial_impact_m: 22,
    description: "Syrah Resources Altman Z 1.4. Mozambique graphite mine below capacity. Alt graphite supply risk.",
    affected: ["Syrah Resources"],
  },
  {
    id: "EVT-SAMSUNG-2024", date: "2024-05-01", name: "Samsung SDI EU Gigafactory Delay",
    type: "SUPPLY", severity: "MEDIUM", financial_impact_m: 55,
    description: "Samsung SDI Hungary gigafactory delayed 18 months. Scania EV battery dual-source timeline pushed.",
    affected: ["Samsung SDI"],
  },
];

/* ── state ──────────────────────────────────────────────────────────────────── */
let filters = { sev: "ALL", tier: "ALL", type: "ALL" };
let zoomStart = 2021;
let selectedEvent = null;

const SEV_COLOR  = { CRITICAL: "#f56565", HIGH: "#ed8936", MEDIUM: "#ecc94b", LOW: "#48bb78" };
const SEV_RADIUS = { CRITICAL: 8, HIGH: 7, MEDIUM: 6, LOW: 5 };

function zColor(z) {
  if (z < 1.81) return "#742a2a";
  if (z < 2.99) return "#7b341e";
  return "#1a3a2a";
}

/* ── filter logic ───────────────────────────────────────────────────────────── */
function toggleFilter(group, val) {
  filters[group] = val;
  document.querySelectorAll(`.pill.${group}-${val}, .pill.sev-${val}, .pill.tier-${val}, .pill.type-${val}`).forEach(el => {
    const grp = [...el.classList].find(c => c.startsWith(group + "-"));
    if (grp) el.classList.remove("active");
  });
  document.querySelectorAll(`.pill`).forEach(el => {
    const cls = [...el.classList];
    if (group === "sev"  && cls.some(c => c.startsWith("sev-")))  el.classList.remove("active");
    if (group === "tier" && cls.some(c => c.startsWith("tier-"))) el.classList.remove("active");
    if (group === "type" && cls.some(c => c.startsWith("type-"))) el.classList.remove("active");
  });
  const target = document.querySelector(`.pill.${group === "sev" ? "sev" : group === "tier" ? "tier" : "type"}-${val}`);
  if (target) target.classList.add("active");
  draw();
}

function setZoomStart(v) {
  zoomStart = v;
  document.getElementById("zoom-lbl").textContent = Math.floor(v) + " →";
  draw();
}

function filteredEvents() {
  return EVENTS.filter(e => {
    if (filters.sev !== "ALL" && e.severity !== filters.sev) return false;
    if (filters.type !== "ALL" && e.type !== filters.type) return false;
    return true;
  });
}

function visibleSuppliers() {
  const evts = filteredEvents();
  const affectedNames = new Set(evts.flatMap(e => e.affected));
  return SUPPLIERS.filter(s => {
    if (filters.tier === "T1" && s.tier !== 1) return false;
    if (filters.tier === "T2" && s.tier !== 2) return false;
    if (filters.tier === "T3" && s.tier < 3)   return false;
    if (filters.sev !== "ALL" || filters.type !== "ALL") {
      return affectedNames.has(s.name);
    }
    return true;
  });
}

/* ── draw ────────────────────────────────────────────────────────────────────── */
function draw() {
  const wrap = document.getElementById("chart-wrap");
  wrap.innerHTML = "";

  const suppliers = visibleSuppliers();
  const events    = filteredEvents();

  if (!suppliers.length) {
    wrap.innerHTML = '<div style="color:#4a5568;padding:40px;text-align:center">No suppliers match current filters.</div>';
    return;
  }

  const ROW_H = 44;
  const margin = { top: 30, right: 20, bottom: 30, left: 160 };
  const W = wrap.clientWidth || 900;
  const innerW = W - margin.left - margin.right;
  const innerH = suppliers.length * ROW_H;
  const H = innerH + margin.top + margin.bottom;

  const now = new Date();
  const xDomain = [new Date(zoomStart + "-01-01"), new Date("2027-01-01")];
  const x = d3.scaleTime().domain(xDomain).range([0, innerW]);
  const y = d3.scaleLinear().domain([0, suppliers.length]).range([0, innerH]);

  const svg = d3.select(wrap)
    .append("svg")
    .attr("width", W)
    .attr("height", H);

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // Row backgrounds (Z-score color) + supplier labels
  suppliers.forEach((sup, i) => {
    const rowY = i * ROW_H;

    // Z-color background strip
    g.append("rect")
      .attr("x", 0).attr("y", rowY + 2)
      .attr("width", innerW).attr("height", ROW_H - 4)
      .attr("rx", 3)
      .attr("fill", zColor(sup.z))
      .attr("opacity", 0.35);

    // Z-score trend line inside row
    if (sup.z_history.length > 1) {
      const zMax = 5.0;
      const lineData = sup.z_history.map(([yr, z]) => [
        x(new Date(yr + "-07-01")),
        rowY + (ROW_H - 4) - (z / zMax) * (ROW_H - 8) + 2
      ]);
      const lineGen = d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveMonotoneX);
      g.append("path")
        .attr("d", lineGen(lineData))
        .attr("fill", "none")
        .attr("stroke", "#a78bfa")
        .attr("stroke-width", 1.2)
        .attr("stroke-dasharray", "3,2")
        .attr("opacity", 0.6);
    }

    // Supplier label (left)
    g.append("text")
      .attr("x", -8).attr("y", rowY + ROW_H / 2 + 1)
      .attr("text-anchor", "end").attr("dominant-baseline", "middle")
      .attr("fill", "#94a3b8").attr("font-size", "11px")
      .attr("font-family", "Segoe UI, sans-serif")
      .text(`T${sup.tier} ${sup.name.length > 20 ? sup.name.slice(0, 19) + "…" : sup.name}`);

    // Z badge (far left of row)
    const zCol = sup.z < 1.81 ? "#f56565" : sup.z < 2.99 ? "#ed8936" : "#48bb78";
    g.append("text")
      .attr("x", -8).attr("y", rowY + ROW_H / 2 + 11)
      .attr("text-anchor", "end").attr("dominant-baseline", "middle")
      .attr("fill", zCol).attr("font-size", "9px")
      .attr("font-family", "Segoe UI, sans-serif")
      .text(`Z=${sup.z.toFixed(1)}`);

    // Row separator
    if (i < suppliers.length - 1) {
      g.append("line")
        .attr("x1", 0).attr("x2", innerW)
        .attr("y1", rowY + ROW_H).attr("y2", rowY + ROW_H)
        .attr("stroke", "#2d3748").attr("stroke-width", 0.5);
    }
  });

  // "Now" vertical line
  const nowX = x(now);
  if (nowX > 0 && nowX < innerW) {
    g.append("line")
      .attr("x1", nowX).attr("x2", nowX)
      .attr("y1", 0).attr("y2", innerH)
      .attr("stroke", "#a78bfa").attr("stroke-width", 1.5)
      .attr("stroke-dasharray", "4,3")
      .attr("opacity", 0.7);
    g.append("text")
      .attr("x", nowX + 4).attr("y", -8)
      .attr("fill", "#a78bfa").attr("font-size", "10px")
      .attr("font-family", "Segoe UI, sans-serif")
      .text("Now");
  }

  // Events
  events.forEach(evt => {
    const evtDate = new Date(evt.date);
    const evtX = x(evtDate);
    if (evtX < 0 || evtX > innerW) return;

    evt.affected.forEach(supName => {
      const si = suppliers.findIndex(s => s.name === supName);
      if (si === -1) return;
      const evtY = si * ROW_H + ROW_H / 2;
      const r = SEV_RADIUS[evt.severity] || 5;
      const col = SEV_COLOR[evt.severity] || "#94a3b8";

      const circ = g.append("circle")
        .attr("cx", evtX).attr("cy", evtY).attr("r", r)
        .attr("fill", col).attr("opacity", 0.85)
        .attr("stroke", "#0f1117").attr("stroke-width", 1.5)
        .style("cursor", "pointer");

      // Glow on selected
      if (selectedEvent && selectedEvent.id === evt.id) {
        circ.attr("r", r + 3).attr("opacity", 1).attr("stroke", "#fff").attr("stroke-width", 2);
      }

      circ.on("mouseenter", function() {
          d3.select(this).attr("r", r + 2).attr("opacity", 1);
        })
        .on("mouseleave", function() {
          if (!(selectedEvent && selectedEvent.id === evt.id))
            d3.select(this).attr("r", r).attr("opacity", 0.85);
        })
        .on("click", function() {
          selectedEvent = evt;
          showDetail(evt);
          draw();
        });

      // Impact label (for CRITICAL events only, if space)
      if (evt.severity === "CRITICAL" && innerW > 600) {
        g.append("text")
          .attr("x", evtX + r + 3).attr("y", evtY + 1)
          .attr("dominant-baseline", "middle")
          .attr("fill", col).attr("font-size", "9px")
          .attr("font-family", "Segoe UI, sans-serif")
          .attr("opacity", 0.8)
          .text(`€${evt.financial_impact_m}M`);
      }
    });
  });

  // X axis
  const xAxis = d3.axisBottom(x)
    .ticks(d3.timeYear.every(1))
    .tickFormat(d3.timeFormat("%Y"));
  g.append("g")
    .attr("transform", `translate(0,${innerH})`)
    .call(xAxis)
    .selectAll("text, path, line")
    .attr("fill", "#718096").attr("stroke", "#4a5568").attr("font-size", "11px");

  // Quarter gridlines
  x.ticks(d3.timeMonth.every(3)).forEach(t => {
    const tx = x(t);
    g.append("line")
      .attr("x1", tx).attr("x2", tx)
      .attr("y1", 0).attr("y2", innerH)
      .attr("stroke", "#2d3748").attr("stroke-width", 0.3)
      .attr("opacity", 0.5);
  });
}

function showDetail(evt) {
  document.getElementById("detail-content").innerHTML = `
    <span class="dp-sev sev-c-${evt.severity}">${evt.severity}</span>
    <div class="dp-event-name">${evt.name}</div>
    <div class="dp-row"><span class="dp-lbl">Date</span><span class="dp-val">${evt.date}</span></div>
    <div class="dp-row"><span class="dp-lbl">Type</span><span class="dp-val">${evt.type}</span></div>
    <div class="dp-row"><span class="dp-lbl">Financial impact</span><span class="dp-val">€${evt.financial_impact_m}M</span></div>
    <div class="dp-impact">${evt.description}</div>
    <div class="dp-suppliers" style="margin-top:10px">
      <div style="font-size:10px;color:#718096;margin-bottom:5px">AFFECTED SUPPLIERS</div>
      ${evt.affected.map(s => `<span class="dp-sup-chip">${s}</span>`).join("")}
    </div>`;
}

/* ── init ────────────────────────────────────────────────────────────────────── */
// Set initial filter pills
document.querySelectorAll(".pill").forEach(el => {
  const cls = [...el.classList];
  if (cls.includes("sev-ALL") || cls.includes("tier-ALL") || cls.includes("type-ALL")) {
    el.classList.add("active");
  }
});

window.addEventListener("resize", draw);
draw();
</script>
</body>
</html>
