<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupplyLens — 3D Supply Chain Graph</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: 'Inter', system-ui, sans-serif; color: #e2e8f0; }

  #app { display: flex; width: 100vw; height: 100vh; }

  #canvas-container { flex: 1; min-width: 0; position: relative; }

  #sidebar {
    width: 320px;
    min-width: 280px;
    max-width: 320px;
    background: #1e293b;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-left: 1px solid #334155;
    z-index: 10;
  }

  #top-bar {
    padding: 14px 16px 12px;
    border-bottom: 1px solid #334155;
    background: #0f172a;
    flex-shrink: 0;
  }

  #title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  #title-row h1 {
    font-size: 1.2rem;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.02em;
  }

  #title-row h1 span { color: #3b82f6; }

  #status-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    white-space: nowrap;
  }
  #status-badge.live { background: #14532d; color: #4ade80; border: 1px solid #166534; }
  #status-badge.embedded { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

  #reconnect-btn {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #94a3b8;
    cursor: pointer;
    margin-left: auto;
    white-space: nowrap;
  }
  #reconnect-btn:hover { background: #334155; color: #e2e8f0; }

  .controls-section { padding: 12px 16px; border-bottom: 1px solid #334155; flex-shrink: 0; }
  .controls-section label { font-size: 0.75rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px; }

  .tier-row, .type-row { display: flex; flex-wrap: wrap; gap: 6px; }

  .cb-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.75rem;
    color: #cbd5e1;
    cursor: pointer;
    user-select: none;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid #334155;
    background: #0f172a;
  }
  .cb-label:hover { border-color: #475569; }
  .cb-label input { cursor: pointer; accent-color: #3b82f6; }

  .risk-filter-row { margin-top: 8px; }
  .risk-filter-row .cb-label { border-color: #7f1d1d; background: #1a0a0a; color: #fca5a5; }

  #sidebar-scroll {
    flex: 1;
    min-height: 180px;
    overflow-y: auto;
    padding: 0;
  }
  #sidebar-scroll::-webkit-scrollbar { width: 5px; }
  #sidebar-scroll::-webkit-scrollbar-track { background: #1e293b; }
  #sidebar-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

  #evidence-panel { padding: 16px; }

  #evidence-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    color: #475569;
  }
  #evidence-empty .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
  #evidence-empty p { font-size: 0.85rem; line-height: 1.5; }

  #evidence-content { display: none; }

  #ev-name {
    font-size: 1.1rem;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  #ev-type-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

  .type-badge {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .tier-badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
  }

  .ev-section { margin-bottom: 14px; }
  .ev-section h3 { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 6px; }

  .ev-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1e293b; font-size: 0.8rem; }

  .ev-row .val { color: #e2e8f0; font-weight: 500; text-align: right; max-width: 55%; word-break: break-word; }

  .ev-link { color: #60a5fa; font-size: 0.8rem; text-decoration: none; }

  .risk-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .risk-badge {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

    flex-shrink: 0;

  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    background: #0f172a;
    border-top: 1px solid #334155;

    color: #e2e8f0 !important;
    border-radius: 6px !important;

    padding: 6px 10px !important;

<div id="app">
  <div id="canvas-container"></div>

    <div id="top-bar">
      <div id="title-row">

        <button id="reconnect-btn" title="Re-try Neo4j connection">&#128279; Reconnect</button>
      </div>

      <div class="controls-section" style="padding:0;border:none;">
        <label>Tiers</label>
        <div class="tier-row">
          <label class="cb-label"><input type="checkbox" data-tier="1" checked> T1</label>

          <label class="cb-label"><input type="checkbox" data-tier="3" checked> T3</label>

// ─── Helpers ────────────────────────────────────────────────────────────────

function countryFlag(code) {
  const flags = {
    SE:'🇸🇪', DE:'🇩🇪', US:'🇺🇸', FR:'🇫🇷', NL:'🇳🇱', GB:'🇬🇧', CN:'🇨🇳', JP:'🇯🇵',
    TW:'🇹🇼', KR:'🇰🇷', AU:'🇦🇺', BR:'🇧🇷', CL:'🇨🇱', CD:'🇨🇩', RU:'🇷🇺', IN:'🇮🇳',
    TH:'🇹🇭', CH:'🇨🇭', BE:'🇧🇪', FI:'🇫🇮', NO:'🇳🇴', AT:'🇦🇹', IL:'🇮🇱', UA:'🇺🇦'
  };
  return flags[code] || '🌐';
}

function fmtRevenue(v) {
  if (!v) return null;
  const b = v / 1e9;
  return '€' + b.toFixed(1) + 'B';
}

function fmtEmployees(v) {
  if (!v) return null;
  if (v >= 1000) return (v/1000).toFixed(0) + 'k';
  return String(v);
}

// ─── Node colour + size ──────────────────────────────────────────────────────

function nodeColor(node) {
  if (node.type === 'Product')     return '#f59e0b';
  if (node.type === 'RawMaterial') return '#8b5cf6';
  if (node.type === 'Certificate') return '#22c55e';
  if (node.type === 'Company')     return '#94a3b8';
  if (node.type === 'Event')       return '#ec4899';
  // Supplier by tier
  const t = node.tier;
  if (t === 1) return '#3b82f6';
  if (t === 2) return '#10b981';
  if (t === 3) return '#f97316';
  if (t === 4) return '#ef4444';
  return '#94a3b8';
}

function nodeBaseSize(node) {
  if (node.type === 'Product') return 8;
  if (node.type === 'Event')   return 5;
  if (node.type === 'Supplier') {
    const t = node.tier;
    if (t === 1) return 6;
    if (t === 2) return 5;
    if (t === 3) return 4;
    if (t === 4) return 3;
  }
  if (node.type === 'RawMaterial')  return 4;
  if (node.type === 'Certificate')  return 3;
  if (node.type === 'Company')      return 4;
  return 4;
}

function nodeVal(node) {
  const base = nodeBaseSize(node);
  const hasRisk = node.risk_flags && node.risk_flags.length > 0;
  return hasRisk ? base * 1.5 : base;
}

// ─── Link colour ─────────────────────────────────────────────────────────────

function linkColor(link) {
  const rel = link.rel || '';
  if (rel === 'SUPPLIED_BY')   return '#3b82f6';
  if (rel === 'SOURCED_FROM')  return '#94a3b8';
  if (rel === 'CERTIFIED_BY')  return '#22c55e';
  if (rel === 'OWNED_BY')      return '#e2e8f0';
  if (rel === 'AFFECTED_BY')   return '#ef4444';
  return '#475569';
}

function riskBadgeHtml(flag) {
  const style = RISK_STYLES[flag] || { bg: '#374151', color: '#9ca3af' };
  return `<span class="risk-badge" style="background:${style.bg};color:${style.color}">${flag.replace(/_/g,' ')}</span>`;
}

// ─── Build node/link maps ─────────────────────────────────────────────────────

let graphData = { nodes: [], links: [] };
let dataSource = 'embedded'; // 'live' | 'embedded'
let autoRotate = true;
let autoRotateReq = null;

// ─── Filter state ─────────────────────────────────────────────────────────────

const filterState = {
  tiers: new Set([1,2,3,4]),
  types: new Set(['Product','RawMaterial','Certificate','Event','Company']),
  riskOnly: false
};

function filteredData() {
  const visibleNodeIds = new Set();
  const nodes = graphData.nodes.filter(n => {
    if (n.type === 'Supplier') {
      if (!filterState.tiers.has(n.tier)) return false;
    } else {
      if (!filterState.types.has(n.type)) return false;
    }
    if (filterState.riskOnly && !(n.risk_flags && n.risk_flags.length)) return false;
    visibleNodeIds.add(n.id);
    return true;
  });
  const links = graphData.links.filter(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    return visibleNodeIds.has(sid) && visibleNodeIds.has(tid);
  });
  return { nodes, links };
}

// ─── Stats ────────────────────────────────────────────────────────────────────

function updateStats(data) {
  const riskCount = data.nodes.filter(n => n.risk_flags && n.risk_flags.length).length;
  document.getElementById('stat-nodes').textContent = data.nodes.length;
  document.getElementById('stat-links').textContent = data.links.length;
  document.getElementById('stat-risk').textContent = riskCount;
}

// ─── Graph init ───────────────────────────────────────────────────────────────

const Graph = ForceGraph3D({ controlType: 'orbit' })(document.getElementById('canvas-container'))
  .backgroundColor('#0f172a')
  .nodeColor(nodeColor)
  .nodeVal(nodeVal)
  .nodeLabel(n => `<div class="graph-tooltip"><strong>${n.name}</strong><br>${n.type}${n.tier ? ' T'+n.tier : ''}</div>`)
  .linkColor(linkColor)
  .linkWidth(l => l.inferred ? 0.5 : 1)
  .linkDirectionalArrowLength(4)
  .linkDirectionalArrowRelPos(1)
  .linkDirectionalParticles(l => l.rel === 'AFFECTED_BY' ? 2 : 0)
  .linkDirectionalParticleColor(() => '#ef4444')
  .linkDirectionalParticleSpeed(0.006)
  .onNodeClick(handleNodeClick)
  .onBackgroundClick(() => {
    autoRotate = true;
    startAutoRotate();
    clearEvidence();
  });

// Auto-rotate
function startAutoRotate() {
  if (autoRotateReq) cancelAnimationFrame(autoRotateReq);
  let angle = 0;
  function tick() {
    if (!autoRotate) return;
    angle += 0.002;
    const dist = 600;
    Graph.cameraPosition({
      x: dist * Math.sin(angle),
      y: 0,
      z: dist * Math.cos(angle)
    });
    autoRotateReq = requestAnimationFrame(tick);
  }
  tick();
}

// Stop rotation on orbit control interaction
document.getElementById('canvas-container').addEventListener('pointerdown', () => {
  autoRotate = false;
  if (autoRotateReq) { cancelAnimationFrame(autoRotateReq); autoRotateReq = null; }
});

// ─── Evidence panel ───────────────────────────────────────────────────────────

function getTypeBadgeStyle(node) {
  const color = nodeColor(node);
  return `background:${color}22;color:${color};border:1px solid ${color}44`;
}

function buildUpstreamPath(nodeId, allLinks) {
  // Walk links in reverse (find links where target === nodeId → get source)
  const path = [nodeId];
  let current = nodeId;
  const visited = new Set([nodeId]);
  for (let depth = 0; depth < 10; depth++) {
    const link = allLinks.find(l => {
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return tid === current && (l.rel === 'SUPPLIED_BY' || l.rel === 'SOURCED_FROM');
    });
    if (!link) break;
    const sid = typeof link.source === 'object' ? link.source.id : link.source;
    if (visited.has(sid)) break;
    path.unshift(sid);
    visited.add(sid);
    current = sid;
  }
  return path;
}

function nodeById(id) {
  return graphData.nodes.find(n => n.id === id);
}

function handleNodeClick(node) {
  autoRotate = false;
  if (autoRotateReq) { cancelAnimationFrame(autoRotateReq); autoRotateReq = null; }

  // Fly camera to node
  const dist = 120;
  const coords = { x: node.x, y: node.y, z: node.z };
  Graph.cameraPosition(
    { x: coords.x + dist, y: coords.y + dist * 0.3, z: coords.z + dist },
    coords,
    1200
  );

  renderEvidence(node);
}

function clearEvidence() {
  document.getElementById('evidence-empty').style.display = '';
  document.getElementById('evidence-content').style.display = 'none';
  document.getElementById('evidence-content').innerHTML = '';
}

function renderEvidence(node) {
  document.getElementById('evidence-empty').style.display = 'none';
  const el = document.getElementById('evidence-content');
  el.style.display = '';

  const flag = node.country ? countryFlag(node.country) : '';
  const typeBadgeStyle = getTypeBadgeStyle(node);
  const tierLabel = node.tier ? ` T${node.tier}` : '';

  // Upstream path
  const pathIds = buildUpstreamPath(node.id, graphData.links);
  const pathHtml = pathIds.length > 1
    ? pathIds.map((pid, i) => {
        const n = nodeById(pid);
        const nm = n ? n.name : pid;
        return `<span class="path-node">${nm}</span>${i < pathIds.length - 1 ? '<span class="path-arrow">→</span>' : ''}`;
      }).join('')
    : '<em style="color:#475569">No upstream path</em>';

  // Risk badges
  const riskHtml = (node.risk_flags && node.risk_flags.length)
    ? `<div class="risk-badges">${node.risk_flags.map(riskBadgeHtml).join('')}</div>`
    : '<span style="color:#475569;font-size:0.8rem">None</span>';

  // Financial rows
  const finRows = [];
  if (node.annual_revenue_eur) finRows.push(['Revenue', fmtRevenue(node.annual_revenue_eur)]);
  if (node.employee_count)     finRows.push(['Employees', fmtEmployees(node.employee_count)]);
  if (node.founded_year)       finRows.push(['Founded', node.founded_year]);
  if (node.headquarters)       finRows.push(['HQ', node.headquarters]);
  if (node.inferred)           finRows.push(['Inferred', 'Yes (LLM)']);

  const finHtml = finRows.length
    ? finRows.map(([k,v]) => `<div class="ev-row"><span class="label">${k}</span><span class="val">${v}</span></div>`).join('')
    : '';

  el.innerHTML = `
    <div id="ev-name">${node.name}</div>
    <div id="ev-type-row">
      <span class="type-badge" style="${typeBadgeStyle}">${node.type}${tierLabel}</span>
      ${node.country ? `<span>${flag} ${node.country}</span>` : ''}
      ${node.inferred ? '<span style="color:#f59e0b;font-size:0.75rem">~ inferred</span>' : ''}
    </div>

    ${node.website ? `<div class="ev-section"><a class="ev-link" href="${node.website}" target="_blank">&#x1F517; ${node.website.replace('https://','')}</a></div>` : ''}

    <div class="ev-section">
      <h3>Risk Flags</h3>
      ${riskHtml}
    </div>

    ${finHtml ? `<div class="ev-section"><h3>Financials</h3>${finHtml}</div>` : ''}

    <div class="ev-section">
      <h3>Supply Chain Path</h3>
      <div class="path-chain">${pathHtml}</div>
    </div>

    <div class="source-label">Source: ${dataSource === 'live' ? 'Live Neo4j' : 'Embedded demo data'}</div>
  `;
}

// ─── Neo4j live fetch ─────────────────────────────────────────────────────────

const NEO4J_URL  = 'http://localhost:7474/db/neo4j/tx/commit';
let   neoPassword = 'bmtKQuCO9vOzyBwyVvt2LrFU';

function parseNeo4jGraph(results) {
  const nodeMap = {};
  const linkSet = [];

  if (!results || !results[0] || !results[0].data) return null;

  for (const row of results[0].data) {
    const g = row.graph;
    if (!g) continue;
    for (const n of (g.nodes || [])) {
      if (!nodeMap[n.id]) {
        const p = n.properties || {};
        const labels = n.labels || [];
        const type = labels.includes('Product') ? 'Product'
          : labels.includes('Supplier')    ? 'Supplier'
          : labels.includes('RawMaterial') ? 'RawMaterial'
          : labels.includes('Certificate') ? 'Certificate'
          : labels.includes('Event')       ? 'Event'
          : labels.includes('Company')     ? 'Company'
          : 'Supplier';

        nodeMap[n.id] = {
          id: n.id,
          name:              p.name || p.sku || n.id,
          type,
          tier:              p.tier ? Number(p.tier) : undefined,
          country:           p.country,
          website:           p.website,
          risk_flags:        p.risk_flags || [],
          annual_revenue_eur:p.annual_revenue_eur ? Number(p.annual_revenue_eur) : undefined,
          employee_count:    p.employee_count     ? Number(p.employee_count) : undefined,
          founded_year:      p.founded_year       ? Number(p.founded_year) : undefined,
          headquarters:      p.headquarters,
          inferred:          p.inferred === true || p.inferred === 'true'
        };
      }
    }
    for (const r of (g.relationships || [])) {
      linkSet.push({
        source:    r.startNode,
        target:    r.endNode,
        rel:       r.type,
        component: (r.properties || {}).component,
        inferred:  (r.properties || {}).inferred === true,
        confidence:(r.properties || {}).confidence
      });
    }
  }

  const nodes = Object.values(nodeMap);
  if (!nodes.length) return null;
  return { nodes, links: linkSet };
}

async function fetchNeo4j(password) {
  const pw = password || neoPassword;
  const resp = await fetch(NEO4J_URL, {
    method:  'POST',
    headers: {
      'Authorization':  'Basic ' + btoa('neo4j:' + pw),
      'Content-Type':   'application/json',
      'Accept':         'application/json'
    },
    body: JSON.stringify({
      statements: [{
        statement: 'MATCH (n)-[r]->(m) RETURN n, r, m LIMIT 800',
        resultDataContents: ['graph']
      }]
    })
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const json = await resp.json();
  if (json.errors && json.errors.length) throw new Error(json.errors[0].message);
  return parseNeo4jGraph(json.results);
}

function setBadge(mode) {
  const badge = document.getElementById('status-badge');
  if (mode === 'live') {
    badge.className = 'live';
    badge.textContent = '● Live Neo4j';
  } else {
    badge.className = 'embedded';
    badge.textContent = '● Embedded data';
  }
}

function loadGraph(data, source) {
  graphData = data;
  dataSource = source;
  setBadge(source);
  applyFilters();
}

function useEmbedded() {
  loadGraph({ nodes: EMBEDDED_NODES, links: EMBEDDED_LINKS }, 'embedded');
}

async function tryNeo4j(pw) {
  try {
    const data = await fetchNeo4j(pw);
    if (data) {
      loadGraph(data, 'live');
      return true;
    }
  } catch (e) {
    // silent fall-through
  }
  return false;
}

// ─── Filter application ───────────────────────────────────────────────────────

function applyFilters() {
  const data = filteredData();
  Graph.graphData(data);
  updateStats(data);
}

// ─── Filter controls wiring ───────────────────────────────────────────────────

document.querySelectorAll('[data-tier]').forEach(cb => {
  cb.addEventListener('change', () => {
    const tier = Number(cb.dataset.tier);
    if (cb.checked) filterState.tiers.add(tier);
    else            filterState.tiers.delete(tier);
    applyFilters();
  });
});

document.querySelectorAll('[data-nodetype]').forEach(cb => {
  cb.addEventListener('change', () => {
    const t = cb.dataset.nodetype;
    if (cb.checked) filterState.types.add(t);
    else            filterState.types.delete(t);
    applyFilters();
  });
});

document.getElementById('risk-only').addEventListener('change', e => {
  filterState.riskOnly = e.target.checked;
  applyFilters();
});

// ─── Reconnect button ─────────────────────────────────────────────────────────

document.getElementById('reconnect-btn').addEventListener('click', async () => {
  const pw = prompt('Neo4j password:', neoPassword) || neoPassword;
  neoPassword = pw;
  const ok = await tryNeo4j(pw);
  if (!ok) {
    alert('Could not connect to Neo4j — using embedded data.');
  }
});

// ─── Responsive resize ────────────────────────────────────────────────────────

function handleResize() {
  const container = document.getElementById('canvas-container');
  Graph.width(container.offsetWidth).height(container.offsetHeight);
}
window.addEventListener('resize', handleResize);
handleResize();

// ─── Boot ─────────────────────────────────────────────────────────────────────

(async () => {
  // Try Neo4j; if it fails fall back to embedded
  const live = await tryNeo4j();
  if (!live) {
    useEmbedded();
  }
  startAutoRotate();
})();
</script>
