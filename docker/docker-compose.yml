# SupplyLens — self-contained stack
# Usage:
#   cp .env.example .env       # fill in NEO4J_PASSWORD, LITELLM_KEY
#   docker compose up -d
#   curl http://localhost:8090/health
#   curl -X POST http://localhost:8090/runs \
#        -H 'Content-Type: application/json' \
#        -d '{"company":"Scania AB","product":"Scania R-series Truck","depth":3}'
#
# Requires Ollama on host with models pulled:
#   ollama pull qwen3:8b && ollama pull nomic-embed-text
#
# On Linux add to your run: --add-host host.docker.internal:host-gateway
# (already set via extra_hosts below)

services:

  # ── Graph database ────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7474/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Seed Scania v10 graph on first boot ──────────────────────────────────
  neo4j-seed:
    image: neo4j:5-community
    restart: "no"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ../example_outputs/sample_graph.cypher:/init/sample_graph.cypher:ro
    entrypoint: >
      sh -c "cypher-shell -a bolt://neo4j:7687
             -u neo4j -p ${NEO4J_PASSWORD:-changeme}
             --file /init/sample_graph.cypher
             && echo 'Scania graph seeded.'"

  # ── Vector database ───────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── LLM proxy (routes to Ollama on host) ─────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_KEY: ${LITELLM_KEY:-sk-uc4local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health/liveliness"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ── UC4 supply chain enrichment agent ────────────────────────────────────
  uc4-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      NEO4J_URL: http://neo4j:7474
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      LITELLM_URL: http://litellm:4000
      LITELLM_KEY: ${LITELLM_KEY:-sk-uc4local}
      QDRANT_URL: http://qdrant:6333
      LLM_MODEL: gpt-4o-mini
      EMBED_MODEL: nomic-embed-text
    depends_on:
      neo4j:
        condition: service_healthy
      litellm:
        condition: service_healthy

  # ── Workflow automation ───────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../config/n8n_workflow.json:/workflows/n8n_workflow.json:ro
    environment:
      N8N_BASIC_AUTH_ACTIVE: "false"
      WEBHOOK_URL: http://localhost:5678

volumes:
  neo4j_data:
  qdrant_data:
  n8n_data:
