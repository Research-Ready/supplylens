---
# Deploy Kotaemon RAG UI on CT120 (node-1, 10.0.1.120)

- name: Create kotaemon data directory
  file:
    path: "{{ kotaemon_data_dir }}"
    state: directory
    mode: "0755"

- name: Create kotaemon config directory
  file:
    path: "{{ kotaemon_data_dir }}/config"
    state: directory
    mode: "0755"

- name: Write kotaemon flowsettings override
  copy:
    dest: "{{ kotaemon_data_dir }}/config/flowsettings.py"
    content: |
      # Kotaemon flowsettings — UC4 Supply Chain
      # Auto-generated by Ansible role kotaemon

      KH_LLMS = {
          "researcher-llm": {
              "spec": {
                  "__type__": "kotaemon.llms.LCOpenAILLM",
                  "openai_api_base": "{{ kotaemon_llm_api_base }}",
                  "openai_api_key": "{{ litellm_master_key | default('sk-placeholder') }}",
                  "model": "{{ kotaemon_llm_model }}",
                  "temperature": 0,
              },
              "default": True,
          }
      }

      KH_EMBEDDINGS = {
          "nomic-embed-text": {
              "spec": {
                  "__type__": "kotaemon.embeddings.LCOpenAIEmbeddings",
                  "openai_api_base": "{{ kotaemon_embed_api_base }}",
                  "openai_api_key": "{{ litellm_master_key | default('sk-placeholder') }}",
                  "model": "{{ kotaemon_embed_model }}",
              },
              "default": True,
          }
      }

      KH_VECTORSTORE = {
          "spec": {
              "__type__": "kotaemon.storages.QdrantVectorStore",
              "url": "http://{{ kotaemon_qdrant_host }}:{{ kotaemon_qdrant_port }}",
              "api_key": "{{ qdrant_api_key | default('') }}",
              "collection_name": "{{ kotaemon_qdrant_collection }}",
          }
      }

      KH_DOCSTORE = {
          "spec": {
              "__type__": "kotaemon.storages.ElasticsearchDocumentStore",
          }
      }

      # Multi-user mode
      KH_ENABLE_AUTH = True
      KH_SHARE_DATA_ACROSS_USERS = False

- name: Pull kotaemon Docker image
  community.docker.docker_image:
    name: "{{ kotaemon_image }}"
    source: pull

- name: Run kotaemon container
  community.docker.docker_container:
    name: kotaemon
    image: "{{ kotaemon_image }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ kotaemon_port }}:7860"
    volumes:
      - "{{ kotaemon_data_dir }}:/app/ktem_app_data"
      - "{{ kotaemon_data_dir }}/config/flowsettings.py:/app/flowsettings.py:ro"
    env:
      GRADIO_SERVER_PORT: "7860"
      GRADIO_SERVER_NAME: "0.0.0.0"

- name: Wait for kotaemon to be ready
  uri:
    url: "http://localhost:{{ kotaemon_port }}/"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 20
  delay: 5

- name: Print kotaemon URL
  debug:
    msg: "Kotaemon running at http://{{ ansible_host }}:{{ kotaemon_port }}"
