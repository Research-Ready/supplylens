---
all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

  children:
    node1:
      vars:
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=accept-new
          -o ProxyJump=root@10.0.0.16
      hosts:
        neo4j:
          ansible_host: 10.0.1.114
        langgraph:
          ansible_host: 10.0.1.119
        kotaemon:
          ansible_host: 10.0.1.120
        unstructured:
          ansible_host: 10.0.1.117
        tika:
          ansible_host: 10.0.1.115
        qdrant:
          ansible_host: 10.0.1.102
        postgres:
          ansible_host: 10.0.1.100
        n8n:
          ansible_host: 10.0.1.104
        langfuse:
          ansible_host: 10.0.1.112
        mongodb:
          ansible_host: 10.0.1.121

    node2:
      vars:
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=accept-new
          -o ProxyJump=root@10.0.0.15
      hosts:
        litellm:
          ansible_host: 10.0.2.205
        superset:
          ansible_host: 10.0.2.206
        metabase:
          ansible_host: 10.0.2.202

    node4:
      vars:
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
      hosts:
        browserless_prod:
          ansible_host: 10.0.0.18  # pct exec 400 for actual service

    proxmox:
      hosts:
        proxmox_node1:
          ansible_host: 10.0.0.16
        proxmox_node2:
          ansible_host: 10.0.0.15
        proxmox_node4:
          ansible_host: 10.0.0.18
